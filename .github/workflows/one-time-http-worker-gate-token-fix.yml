name: One-time HTTP worker gate token correction

on:
  push:
    branches: [main]
    paths:
      - ".github/http-worker-gate-token-fix.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct HTTP worker gate tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("scripts/check-http-worker-contract.mjs")
          source = target.read_text(encoding="utf-8")
          replacements = [
              ("'objectStoreMode must be file or http'", "'object-store-mode must be file or http'"),
              ('  "createVectorWorkerObjectClient",\n  "downloadSha256Verification",',
               '  "createVectorWorkerObjectClient",\n  "actualSha256 !== digest",'),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"HTTP_GATE_TOKEN_ANCHOR_INVALID:{old}:{source.count(old)}")
              source = source.replace(old, new, 1)
          target.write_text(source, encoding="utf-8")
          PY
          git diff --check

      - name: Commit correction and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-http-worker-gate-token-fix.yml \
            .github/http-worker-gate-token-fix.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "test(http-worker): correct remote mode gate tokens"
          git pull --rebase origin main
          git push origin HEAD:main
