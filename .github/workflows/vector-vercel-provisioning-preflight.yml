name: Vector Studio Vercel provisioning preflight
run-name: Vector provider preflight @ ${{ inputs.commit }}

on:
  # Retired compatibility marker: .github/vector-vercel-preflight.trigger
  workflow_dispatch:
    inputs:
      commit:
        description: Exact lowercase 40-character current main commit
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-vercel-provisioning-preflight
  cancel-in-progress: true

jobs:
  preflight:
    environment: vector-studio-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact current main
        id: current_main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            core.setOutput("sha", data.commit.sha);

      - name: Verify exact current main identity
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.current_main.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The provider preflight commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$CURRENT_MAIN_SHA"
          test "$CURRENT_MAIN_SHA" = "${{ inputs.commit }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Use repository Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify provider inspection source boundary
        run: |
          node scripts/check-lockfile-integrity.mjs
          node scripts/check-vercel-project-provisioning-contract.mjs
          node scripts/check-vercel-provisioning-plan-receipt-contract.mjs
          node scripts/project-vector-provider-remediation-receipt.mjs --self-test
          node scripts/provision-vector-studio-vercel.mjs --self-test
          node scripts/plan-vector-studio-vercel-provisioning.mjs --self-test
          node scripts/enforce-vercel-provider-inspection-receipt.mjs --self-test

      - name: Create bounded no-mutation provider plan
        id: plan
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVAVO_CLIENT_APP_LAUNCH_SECRET: ${{ secrets.EVAVO_CLIENT_APP_LAUNCH_SECRET }}
          EVAVO_VECTOR_PRIVATE_SIGNING_SECRET: ${{ secrets.EVAVO_VECTOR_PRIVATE_SIGNING_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VECTOR_API_TOKEN: ${{ secrets.VECTOR_API_TOKEN }}
          VECTOR_WORKER_API_TOKEN: ${{ secrets.VECTOR_WORKER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          node scripts/plan-vector-studio-vercel-provisioning.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-provisioning-preflight.json

      - name: Enforce bounded provider inspection receipt
        id: inspection
        if: always()
        continue-on-error: true
        run: |
          node scripts/enforce-vercel-provider-inspection-receipt.mjs \
            --receipt .ci/vector-vercel-provisioning-preflight.json \
            --commit "${{ inputs.commit }}"

      - name: Project canonical remediation state
        id: projection
        if: ${{ always() && steps.inspection.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          node scripts/project-vector-provider-remediation-receipt.mjs \
            --receipt .ci/vector-vercel-provisioning-preflight.json \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-provider-remediation-projection.json

      - name: Preserve bounded provider receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-vercel-provisioning-preflight-${{ inputs.commit }}
          path: |
            .ci/vector-vercel-provisioning-preflight.json
            .ci/vector-provider-remediation-projection.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Publish provider inspection status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INSPECTION_OUTCOME: ${{ steps.inspection.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
          INSPECTED_COMMIT: ${{ inputs.commit }}
        with:
          script: |
            const passed =
              process.env.INSPECTION_OUTCOME === "success" &&
              process.env.PROJECTION_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.INSPECTED_COMMIT,
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-vercel-preflight",
              description: passed
                ? "read-only Vector provider inspection passed; remediation projection passed"
                : "Vector provider inspection or remediation projection is unavailable or contradictory",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce provider inspection result
        if: always()
        env:
          INSPECTION_OUTCOME: ${{ steps.inspection.outcome }}
          PROJECTION_OUTCOME: ${{ steps.projection.outcome }}
        run: |
          test "$INSPECTION_OUTCOME" = "success"
          test "$PROJECTION_OUTCOME" = "success"
