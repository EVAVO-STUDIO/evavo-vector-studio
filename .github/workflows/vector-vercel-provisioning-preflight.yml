name: Vector Studio Vercel provisioning preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/vector-vercel-preflight.trigger"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-vercel-provisioning-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check credentials and connected Vercel state without mutation
        id: preflight
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVAVO_CLIENT_APP_LAUNCH_SECRET: ${{ secrets.EVAVO_CLIENT_APP_LAUNCH_SECRET }}
          EVAVO_VECTOR_PRIVATE_SIGNING_SECRET: ${{ secrets.EVAVO_VECTOR_PRIVATE_SIGNING_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VECTOR_API_TOKEN: ${{ secrets.VECTOR_API_TOKEN }}
          VECTOR_WORKER_API_TOKEN: ${{ secrets.VECTOR_WORKER_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          const TEAM_ID = "team_ckKLAnG3MGJK0mMpIVpjbogl";
          const TEAM_SLUG = "evavos-projects";
          const PROJECT_NAME = "evavo-vector-studio";
          const required = [
            "VERCEL_TOKEN",
            "EVAVO_CLIENT_APP_LAUNCH_SECRET",
            "EVAVO_VECTOR_PRIVATE_SIGNING_SECRET",
            "UPSTASH_REDIS_REST_URL",
            "UPSTASH_REDIS_REST_TOKEN",
            "VECTOR_API_TOKEN",
            "VECTOR_WORKER_API_TOKEN",
          ];
          const authorityKeys = [
            "EVAVO_CLIENT_APP_LAUNCH_SECRET",
            "EVAVO_VECTOR_PRIVATE_SIGNING_SECRET",
            "VECTOR_API_TOKEN",
            "VECTOR_WORKER_API_TOKEN",
          ];
          const missing = required.filter((key) => !String(process.env[key] ?? "").trim());
          const invalid = [];

          for (const key of required) {
            const value = String(process.env[key] ?? "").trim();
            if (!value) continue;
            if (key === "UPSTASH_REDIS_REST_URL") {
              try {
                const url = new URL(value);
                if (url.protocol !== "https:" || url.username || url.password || url.hash) invalid.push(`${key}:invalid-https-url`);
              } catch {
                invalid.push(`${key}:invalid-https-url`);
              }
              continue;
            }
            const minimum = key === "VERCEL_TOKEN" ? 20 : 32;
            if (value.length < minimum) invalid.push(`${key}:below-minimum-length`);
            if (/\s/.test(value)) invalid.push(`${key}:contains-whitespace`);
          }

          const seenAuthorities = new Map();
          for (const key of authorityKeys) {
            const value = String(process.env[key] ?? "").trim();
            if (!value) continue;
            const digest = crypto.createHash("sha256").update(value).digest("hex");
            const previous = seenAuthorities.get(digest);
            if (previous) invalid.push(`${key}:duplicates-${previous}`);
            else seenAuthorities.set(digest, key);
          }

          let vercelAuthPassed = false;
          let projectExists = null;
          let projectId = null;
          let projectCount = null;
          let vercelApiStatus = null;
          let vercelApiError = null;

          async function inspectVercel() {
            const token = String(process.env.VERCEL_TOKEN ?? "").trim();
            if (!token || missing.includes("VERCEL_TOKEN") || invalid.some((item) => item.startsWith("VERCEL_TOKEN:"))) return;
            try {
              const response = await fetch(`https://api.vercel.com/v9/projects?teamId=${encodeURIComponent(TEAM_ID)}&limit=100`, {
                method: "GET",
                headers: {
                  authorization: `Bearer ${token}`,
                  accept: "application/json",
                  "accept-encoding": "identity",
                },
                redirect: "error",
                signal: AbortSignal.timeout(20_000),
              });
              vercelApiStatus = response.status;
              const text = await response.text();
              if (Buffer.byteLength(text, "utf8") > 1_000_000) throw new Error("bounded Vercel response exceeded");
              if (!response.ok) {
                vercelApiError = `HTTP_${response.status}`;
                return;
              }
              const payload = JSON.parse(text);
              const projects = Array.isArray(payload.projects) ? payload.projects : [];
              projectCount = projects.length;
              const project = projects.find((item) => item && item.name === PROJECT_NAME) ?? null;
              projectExists = Boolean(project);
              projectId = typeof project?.id === "string" ? project.id : null;
              vercelAuthPassed = true;
            } catch (error) {
              vercelApiError = error instanceof Error ? error.name : "VERCEL_API_FAILED";
            }
          }

          inspectVercel().then(() => {
            const passed = missing.length === 0 && invalid.length === 0 && vercelAuthPassed;
            const report = Object.freeze({
              version: "1.0",
              check: "vector-studio-vercel-provisioning-preflight",
              repository: "EVAVO-STUDIO/evavo-vector-studio",
              commit: process.env.GITHUB_SHA ?? null,
              team: Object.freeze({ id: TEAM_ID, slug: TEAM_SLUG }),
              expectedProject: PROJECT_NAME,
              passed,
              credentials: Object.freeze({
                required: Object.freeze(required),
                missing: Object.freeze(missing),
                invalid: Object.freeze(invalid),
                authoritySeparationPassed: !invalid.some((item) => item.includes(":duplicates-")),
              }),
              vercel: Object.freeze({
                authenticationPassed: vercelAuthPassed,
                apiStatus: vercelApiStatus,
                apiError: vercelApiError,
                projectCount,
                projectExists,
                projectId,
              }),
              mutationPerformed: false,
              sensitiveValuesRecorded: false,
            });
            const serialized = `${JSON.stringify(report, null, 2)}\n`;
            if (Buffer.byteLength(serialized, "utf8") > 64 * 1024) throw new Error("preflight report exceeded bounded size");
            fs.writeFileSync(".ci/vector-vercel-provisioning-preflight.json", serialized, { encoding: "utf8", flag: "wx" });
            process.stdout.write(serialized);
            if (!passed) process.exitCode = 1;
          }).catch((error) => {
            process.stderr.write(`${JSON.stringify({
              check: "vector-studio-vercel-provisioning-preflight",
              passed: false,
              error: error instanceof Error ? error.message : String(error),
              mutationPerformed: false,
              sensitiveValuesRecorded: false,
            }, null, 2)}\n`);
            process.exitCode = 1;
          });
          NODE

      - name: Preserve bounded preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-vercel-provisioning-preflight-${{ github.sha }}
          path: .ci/vector-vercel-provisioning-preflight.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Publish provisioning preflight status
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        with:
          script: |
            const passed = process.env.PREFLIGHT_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-vercel-preflight",
              description: passed
                ? "production credentials and Vercel authentication passed"
                : "Vector Studio Vercel provisioning preflight failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce preflight result
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: test "$PREFLIGHT_OUTCOME" = "success"
