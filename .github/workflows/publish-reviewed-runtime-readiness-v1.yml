name: Materialize reviewed Vector runtime readiness v1

on:
  push:
    branches: [main]
    paths:
      - "ops/reviewed/vector-runtime-readiness-v1.ready"

permissions:
  contents: read
  statuses: write

concurrency:
  group: materialize-reviewed-vector-runtime-readiness-v1
  cancel-in-progress: true

jobs:
  materialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Publish running status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "ci/vector-readiness-materialization",
              description: "reviewed readiness tree materialization is running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Use repository Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Apply reviewed readiness and isolation surfaces
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python ops/reviewed/apply-runtime-readiness-v1.py
          python - <<'PY'
          from pathlib import Path
          target = Path("scripts/check-readiness-contract.mjs")
          source = target.read_text(encoding="utf-8")
          replacements = {
              'environmentValue(environment, "UPSTASH_REDIS_REST_URL")': '"UPSTASH_REDIS_REST_URL"',
              'environmentValue(environment, "UPSTASH_REDIS_REST_TOKEN")': '"UPSTASH_REDIS_REST_TOKEN"',
              '"GET /api/v1/capabilities",': '"GET  /api/v1/capabilities",',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"expected one readiness assertion match: {old}")
              source = source.replace(old, new, 1)
          target.write_text(source, encoding="utf-8")
          PY
          python ops/reviewed/apply-test-build-isolation-v1.py
          python ops/reviewed/align-test-isolation-contracts-v1.py

      - name: Validate complete reviewed change
        id: validate
        if: ${{ steps.apply.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-readiness-contract.mjs
          node scripts/check-test-build-isolation.mjs
          node scripts/check-capability-discovery.mjs
          node scripts/check-mcp-contract.mjs
          pnpm install --frozen-lockfile
          pnpm check
          git diff --check

      - name: Materialize reviewed tree evidence
        id: materialize
        if: ${{ steps.apply.outcome == 'success' && steps.validate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/publish-reviewed-runtime-readiness-v1.yml \
            ops/reviewed/apply-runtime-readiness-v1.py \
            ops/reviewed/apply-test-build-isolation-v1.py \
            ops/reviewed/align-test-isolation-contracts-v1.py \
            ops/reviewed/vector-runtime-readiness-v1.ready
          git config user.name "EVAVO reviewed materializer"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(readiness): expose governed production posture" \
            -m "Add a public secret-free runtime readiness projection and eliminate same-output build/test races across the monorepo. Align capability discovery, API and MCP documentation, focused CI and the exhaustive quality gate while keeping client promotion and managed execution disabled until live evidence exists."
          mkdir -p .ci/vector-readiness-reviewed/files
          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          out = root / ".ci" / "vector-readiness-reviewed"
          parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          changed_raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "--diff-filter=ACMRTUXB", "-z", "HEAD^", "HEAD"
          ])
          deleted_raw = subprocess.check_output([
              "git", "diff", "--no-renames", "--name-only", "--diff-filter=D", "-z", "HEAD^", "HEAD"
          ])
          changed = [entry.decode("utf-8") for entry in changed_raw.split(b"\0") if entry]
          deleted = [entry.decode("utf-8") for entry in deleted_raw.split(b"\0") if entry]
          for relative in changed:
              source = root / relative
              target = out / "files" / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          manifest = {
              "version": "1.0",
              "repository": "EVAVO-STUDIO/evavo-vector-studio",
              "parent": parent,
              "reviewedCommit": commit,
              "changed": changed,
              "deleted": deleted,
              "sensitiveValuesIncluded": False,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload reviewed tree evidence
        id: upload
        if: ${{ steps.materialize.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-readiness-reviewed-${{ github.sha }}
          path: .ci/vector-readiness-reviewed
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Publish final status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        with:
          script: |
            const passed =
              process.env.APPLY_OUTCOME === "success" &&
              process.env.VALIDATE_OUTCOME === "success" &&
              process.env.MATERIALIZE_OUTCOME === "success" &&
              process.env.UPLOAD_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "ci/vector-readiness-materialization",
              description: passed
                ? "reviewed readiness tree materialized"
                : "reviewed readiness tree materialization failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce materialization result
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          test "$APPLY_OUTCOME" = "success"
          test "$VALIDATE_OUTCOME" = "success"
          test "$MATERIALIZE_OUTCOME" = "success"
          test "$UPLOAD_OUTCOME" = "success"
