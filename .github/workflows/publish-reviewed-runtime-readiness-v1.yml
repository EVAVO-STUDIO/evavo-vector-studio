name: Publish reviewed Vector runtime readiness v1

on:
  push:
    branches: [main]
    paths:
      - "ops/reviewed/vector-runtime-readiness-v1.ready"

permissions:
  contents: write

concurrency:
  group: publish-reviewed-vector-runtime-readiness-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Use repository Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Apply reviewed readiness surface
        shell: bash
        run: python ops/reviewed/apply-runtime-readiness-v1.py

      - name: Validate complete reviewed change
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-readiness-contract.mjs
          node scripts/check-capability-discovery.mjs
          node scripts/check-mcp-contract.mjs
          pnpm install --frozen-lockfile
          pnpm check
          git diff --check

      - name: Publish reviewed change to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/publish-reviewed-runtime-readiness-v1.yml \
            ops/reviewed/apply-runtime-readiness-v1.py \
            ops/reviewed/vector-runtime-readiness-v1.ready
          git config user.name "EVAVO reviewed publisher"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(readiness): expose governed production posture" \
            -m "Add a public secret-free runtime readiness projection for interactive production, durable automation and release-proof blockers. Align capability discovery, API and MCP documentation, focused CI and the exhaustive quality gate while keeping client promotion and managed execution disabled until live evidence exists."
          git push origin HEAD:main
