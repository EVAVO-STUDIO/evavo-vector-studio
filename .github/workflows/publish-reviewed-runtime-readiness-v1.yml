name: Publish reviewed Vector runtime readiness source v1

on:
  push:
    branches: [main]
    paths:
      - "ops/reviewed/vector-runtime-readiness-v1.ready"

permissions:
  contents: write
  statuses: write

concurrency:
  group: publish-reviewed-vector-runtime-readiness-source-v1
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Publish running status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "ci/vector-readiness-source-publisher",
              description: "reviewed non-workflow readiness publication is running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Use repository Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Apply reviewed readiness and isolation surfaces
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python ops/reviewed/apply-runtime-readiness-v1.py
          python - <<'PY'
          from pathlib import Path
          target = Path("scripts/check-readiness-contract.mjs")
          source = target.read_text(encoding="utf-8")
          replacements = {
              'environmentValue(environment, "UPSTASH_REDIS_REST_URL")': '"UPSTASH_REDIS_REST_URL"',
              'environmentValue(environment, "UPSTASH_REDIS_REST_TOKEN")': '"UPSTASH_REDIS_REST_TOKEN"',
              '"GET /api/v1/capabilities",': '"GET  /api/v1/capabilities",',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"expected one readiness assertion match: {old}")
              source = source.replace(old, new, 1)
          target.write_text(source, encoding="utf-8")
          PY
          python ops/reviewed/apply-test-build-isolation-v1.py
          python ops/reviewed/align-test-isolation-contracts-v1.py

      - name: Validate complete reviewed change
        id: validate
        if: ${{ steps.apply.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-readiness-contract.mjs
          node scripts/check-test-build-isolation.mjs
          node scripts/check-capability-discovery.mjs
          node scripts/check-mcp-contract.mjs
          pnpm install --frozen-lockfile
          pnpm check
          git diff --check

      - name: Publish non-workflow source changes
        id: publish
        if: ${{ steps.apply.outcome == 'success' && steps.validate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .turbo
          rm -f apps/web/next-env.d.ts apps/web/tsconfig.tsbuildinfo
          rm -f \
            ops/reviewed/apply-runtime-readiness-v1.py \
            ops/reviewed/apply-test-build-isolation-v1.py \
            ops/reviewed/align-test-isolation-contracts-v1.py \
            ops/reviewed/vector-runtime-readiness-v1.ready
          git add -A
          git reset -- \
            .github/workflows/quality.yml \
            .github/workflows/readiness-contract.yml \
            .github/workflows/publish-reviewed-runtime-readiness-v1.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name "EVAVO reviewed publisher"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat(readiness): expose governed production posture" \
            -m "Add a public secret-free runtime readiness projection and eliminate same-output build/test races across the monorepo. Align capability discovery, API and MCP documentation while keeping client promotion and managed execution disabled until live evidence exists."
          git push origin HEAD:main

      - name: Publish final status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const passed =
              process.env.APPLY_OUTCOME === "success" &&
              process.env.VALIDATE_OUTCOME === "success" &&
              process.env.PUBLISH_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "ci/vector-readiness-source-publisher",
              description: passed
                ? "reviewed non-workflow readiness source published"
                : "reviewed non-workflow readiness publication failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce publication result
        if: always()
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          test "$APPLY_OUTCOME" = "success"
          test "$VALIDATE_OUTCOME" = "success"
          test "$PUBLISH_OUTCOME" = "success"
