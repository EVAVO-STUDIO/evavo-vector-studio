name: Materialize exact quality workflow once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/align-source-contracts-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: vector-materialize-quality-workflow-once-${{ github.sha }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact materializer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Publish materialization run locator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "vector/quality-workflow-materialization",
              description: "validating the exact 33-contract workflow object",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Use the repository Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Generate exact quality workflow
        run: node scripts/materialize-quality-workflow-once.mjs

      - name: Verify generated workflow shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(grep -c '^        id: contract_' .github/workflows/quality.yml)" = "33"
          grep -Fq 'node-version-file: .nvmrc' .github/workflows/quality.yml
          grep -Fq 'id: contract_runtime' .github/workflows/quality.yml
          ! grep -Fq 'Run governed source contracts' .github/workflows/quality.yml
          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          test "${#changed[@]}" = "1"
          test "${changed[0]}" = ".github/workflows/quality.yml"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete repository validation
        run: pnpm check

      - name: Clean validation-only generated files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .turbo
          rm -f apps/web/next-env.d.ts apps/web/tsconfig.tsbuildinfo
          git diff --check

      - name: Create validated workflow commit object
        id: object
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/align-source-contracts-once.yml
          rm scripts/materialize-quality-workflow-once.mjs

          mapfile -t changed < <(git status --porcelain | sed -E 's/^.. //')
          expected=(
            .github/workflows/align-source-contracts-once.yml
            .github/workflows/quality.yml
            scripts/materialize-quality-workflow-once.mjs
          )
          printf '%s\n' "${changed[@]}" | sort > .ci-object-changed.txt
          printf '%s\n' "${expected[@]}" | sort > .ci-object-expected.txt
          diff -u .ci-object-expected.txt .ci-object-changed.txt
          rm .ci-object-changed.txt .ci-object-expected.txt

          git config user.name "EVAVO Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): publish exact-head quality workflow"

          commit_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          quality_blob_sha="$(git rev-parse 'HEAD:.github/workflows/quality.yml')"
          printf 'MATERIALIZED_COMMIT_SHA=%s\n' "$commit_sha"
          printf 'MATERIALIZED_TREE_SHA=%s\n' "$tree_sha"
          printf 'MATERIALIZED_QUALITY_BLOB_SHA=%s\n' "$quality_blob_sha"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"
          echo "quality_blob_sha=$quality_blob_sha" >> "$GITHUB_OUTPUT"

      - name: Upload commit object through guarded main push
        id: push
        continue-on-error: true
        shell: bash
        run: git push origin HEAD:main

      - name: Preserve materialized object identity
        if: always()
        shell: bash
        env:
          COMMIT_SHA: ${{ steps.object.outputs.commit_sha }}
          TREE_SHA: ${{ steps.object.outputs.tree_sha }}
          QUALITY_BLOB_SHA: ${{ steps.object.outputs.quality_blob_sha }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          test -n "$COMMIT_SHA"
          test -n "$TREE_SHA"
          test -n "$QUALITY_BLOB_SHA"
          printf 'materialized commit: %s\n' "$COMMIT_SHA"
          printf 'materialized tree: %s\n' "$TREE_SHA"
          printf 'materialized quality blob: %s\n' "$QUALITY_BLOB_SHA"
          printf 'direct push outcome: %s\n' "$PUSH_OUTCOME"

      - name: Publish materialization result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OBJECT_OUTCOME: ${{ steps.object.outcome }}
          QUALITY_BLOB_SHA: ${{ steps.object.outputs.quality_blob_sha }}
        with:
          script: |
            const passed = process.env.OBJECT_OUTCOME === "success";
            const blob = String(process.env.QUALITY_BLOB_SHA || "");
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "vector/quality-workflow-materialization",
              description: passed
                ? `validated workflow blob ${blob.slice(0, 12)}`
                : "workflow object materialization failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
