name: Vector Studio print preflight

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/web/app/api/v1/print/preflight/**"
      - "apps/web/app/api/v1/capabilities/route.ts"
      - "apps/web/lib/api-security.ts"
      - "packages/vector-core/src/print-preflight.ts"
      - "packages/vector-core/src/print-preflight.test.ts"
      - "packages/vector-core/src/index.ts"
      - "packages/cli/src/print-cli.ts"
      - "packages/cli/package.json"
      - "packages/mcp/src/print-tools.ts"
      - "packages/mcp/src/print-tools.test.ts"
      - "packages/mcp/src/server.ts"
      - "packages/mcp/package.json"
      - "scripts/check-print-preflight-api-contract.mjs"
      - "scripts/check-capability-discovery.mjs"
      - "scripts/check-mcp-contract.mjs"
      - "docs/PRINT-PREFLIGHT.md"
      - "docs/CAPABILITIES.md"
      - "docs/MCP.md"
      - ".github/workflows/print-preflight-contract.yml"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/web/app/api/v1/print/preflight/**"
      - "apps/web/app/api/v1/capabilities/route.ts"
      - "apps/web/lib/api-security.ts"
      - "packages/vector-core/src/print-preflight.ts"
      - "packages/vector-core/src/print-preflight.test.ts"
      - "packages/vector-core/src/index.ts"
      - "packages/cli/src/print-cli.ts"
      - "packages/cli/package.json"
      - "packages/mcp/src/print-tools.ts"
      - "packages/mcp/src/print-tools.test.ts"
      - "packages/mcp/src/server.ts"
      - "packages/mcp/package.json"
      - "scripts/check-print-preflight-api-contract.mjs"
      - "scripts/check-capability-discovery.mjs"
      - "scripts/check-mcp-contract.mjs"
      - "docs/PRINT-PREFLIGHT.md"
      - "docs/CAPABILITIES.md"
      - "docs/MCP.md"
      - ".github/workflows/print-preflight-contract.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-print-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm 10.14.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10.14.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Verify print preflight source contract
        id: contract
        continue-on-error: true
        run: node scripts/check-print-preflight-api-contract.mjs

      - name: Install exact dependencies
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Build canonical workspace packages
        id: dependencies
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: pnpm build:packages

      - name: Run core, CLI and MCP print tests
        id: tests
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: |
          pnpm --filter @evavo/vector-core test
          pnpm --filter @evavo/vector-cli test
          pnpm --filter @evavo/vector-mcp test

      - name: Typecheck Vector web
        id: typecheck
        if: ${{ steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: pnpm --filter @evavo/vector-web typecheck

      - name: Build Vector web through workspace dependencies
        id: build
        if: ${{ steps.dependencies.outcome == 'success' && steps.typecheck.outcome == 'success' }}
        continue-on-error: true
        run: pnpm exec turbo run build --filter=@evavo/vector-web

      - name: Publish print preflight statuses
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const dependenciesPassed =
              process.env.INSTALL_OUTCOME === "success" &&
              process.env.DEPENDENCIES_OUTCOME === "success";
            const gates = [
              [
                "print/vector-preflight-contract",
                process.env.CONTRACT_OUTCOME === "success",
                "print preflight contract",
              ],
              [
                "print/vector-preflight-tests",
                dependenciesPassed && process.env.TESTS_OUTCOME === "success",
                "print preflight tests",
              ],
              [
                "print/vector-preflight-build",
                dependenciesPassed &&
                  process.env.TYPECHECK_OUTCOME === "success" &&
                  process.env.BUILD_OUTCOME === "success",
                "print preflight web build",
              ],
            ];
            for (const [name, passed, label] of gates) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: passed ? "success" : "failure",
                context: name,
                description: passed ? `${label} passed` : `${label} failed`,
                target_url: targetUrl,
              });
            }

      - name: Enforce print preflight validation
        if: always()
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test "$CONTRACT_OUTCOME" = "success"
          test "$INSTALL_OUTCOME" = "success"
          test "$DEPENDENCIES_OUTCOME" = "success"
          test "$TESTS_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
