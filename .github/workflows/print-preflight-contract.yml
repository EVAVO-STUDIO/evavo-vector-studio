name: Vector Studio print preflight
# Governed manual deep-proof source inventory:
# - "apps/web/app/api/v1/print/preflight/**"
# - "packages/vector-core/src/print-preflight.ts"
# - "packages/cli/src/print-cli.ts"
# - "packages/cli/bin/evavo-vector-print.mjs"
# - "packages/mcp/src/print-tools.ts"
# - "packages/mcp/src/print-tools.test.ts"

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-print-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use the repository Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        id: pnpm
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)" 2>&1 | tee .ci/print-pnpm-bootstrap.log
          corepack enable 2>&1 | tee -a .ci/print-pnpm-bootstrap.log
          corepack prepare pnpm@10.14.0 --activate 2>&1 | tee -a .ci/print-pnpm-bootstrap.log
          version="$(pnpm --version)"
          printf 'pnpm %s\n' "$version" | tee -a .ci/print-pnpm-bootstrap.log
          test "$version" = "10.14.0"
          git diff --exit-code

      - name: Verify print preflight source contract
        id: contract
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          node scripts/check-print-preflight-api-contract.mjs 2>&1 | tee .ci/print-contract.log
          node scripts/check-capability-discovery.mjs 2>&1 | tee -a .ci/print-contract.log
          node scripts/check-mcp-contract.mjs 2>&1 | tee -a .ci/print-contract.log

      - name: Install exact dependencies
        id: install
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci/print-install.log
          if grep -F "Failed to create bin" .ci/print-install.log; then
            echo "workspace CLI bins must exist before package build" >&2
            exit 1
          fi

      - name: Build canonical workspace packages
        id: dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm build:packages 2>&1 | tee .ci/print-dependencies.log

      - name: Run Vector core print tests
        id: core_tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @evavo/vector-core test 2>&1 | tee .ci/print-core-tests.log

      - name: Run Vector CLI print tests
        id: cli_tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @evavo/vector-cli test 2>&1 | tee .ci/print-cli-tests.log

      - name: Run Vector MCP print tests
        id: mcp_tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @evavo/vector-mcp test 2>&1 | tee .ci/print-mcp-tests.log

      - name: Typecheck Vector web
        id: typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @evavo/vector-web typecheck 2>&1 | tee .ci/print-web-typecheck.log

      - name: Build Vector web through workspace dependencies
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec turbo run build --filter=@evavo/vector-web 2>&1 | tee .ci/print-web-build.log

      - name: Publish print preflight statuses
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CORE_TESTS_OUTCOME: ${{ steps.core_tests.outcome }}
          CLI_TESTS_OUTCOME: ${{ steps.cli_tests.outcome }}
          MCP_TESTS_OUTCOME: ${{ steps.mcp_tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const toolchainPassed = process.env.PNPM_OUTCOME === "success";
            const dependenciesPassed =
              toolchainPassed &&
              process.env.INSTALL_OUTCOME === "success" &&
              process.env.DEPENDENCIES_OUTCOME === "success";
            const testsPassed =
              dependenciesPassed &&
              process.env.CORE_TESTS_OUTCOME === "success" &&
              process.env.CLI_TESTS_OUTCOME === "success" &&
              process.env.MCP_TESTS_OUTCOME === "success";
            const gates = [
              ["print/vector-preflight-contract", toolchainPassed && process.env.CONTRACT_OUTCOME === "success", "print preflight contract"],
              ["print/vector-preflight-core", dependenciesPassed && process.env.CORE_TESTS_OUTCOME === "success", "Vector core print tests"],
              ["print/vector-preflight-cli", dependenciesPassed && process.env.CLI_TESTS_OUTCOME === "success", "Vector CLI print tests"],
              ["print/vector-preflight-mcp", dependenciesPassed && process.env.MCP_TESTS_OUTCOME === "success", "Vector MCP print tests"],
              ["print/vector-preflight-tests", testsPassed, "print preflight tests"],
              [
                "print/vector-preflight-build",
                dependenciesPassed &&
                  process.env.TYPECHECK_OUTCOME === "success" &&
                  process.env.BUILD_OUTCOME === "success",
                "print preflight web build",
              ],
            ];
            for (const [name, passed, label] of gates) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: passed ? "success" : "failure",
                context: name,
                description: passed ? `${label} passed` : `${label} failed`,
                target_url: targetUrl,
              });
            }

      - name: Preserve print diagnostics
        if: ${{ always() && (steps.pnpm.outcome != 'success' || steps.contract.outcome != 'success' || steps.install.outcome != 'success' || steps.dependencies.outcome != 'success' || steps.core_tests.outcome != 'success' || steps.cli_tests.outcome != 'success' || steps.mcp_tests.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.build.outcome != 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-print-preflight-${{ github.sha }}
          path: .ci/print-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce print preflight validation
        if: ${{ always() }}
        env:
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CORE_TESTS_OUTCOME: ${{ steps.core_tests.outcome }}
          CLI_TESTS_OUTCOME: ${{ steps.cli_tests.outcome }}
          MCP_TESTS_OUTCOME: ${{ steps.mcp_tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          test "$PNPM_OUTCOME" = "success"
          test "$CONTRACT_OUTCOME" = "success"
          test "$INSTALL_OUTCOME" = "success"
          test "$DEPENDENCIES_OUTCOME" = "success"
          test "$CORE_TESTS_OUTCOME" = "success"
          test "$CLI_TESTS_OUTCOME" = "success"
          test "$MCP_TESTS_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
