name: One-time browser gate case repair

on:
  push:
    branches: [main]
    paths:
      - ".github/browser-gate-case-repair.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-browser-gate-case-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make browser wording assertions case-stable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for filename in [
              "scripts/check-lottie-workspace-contract.mjs",
              "scripts/check-dotlottie-workspace-contract.mjs",
          ]:
              target = Path(filename)
              source = target.read_text(encoding="utf-8")
              old = '"Browser archive-load validation is available after exact archive verification"'
              new = '"browser archive-load validation is available after exact archive verification"'
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"BROWSER_GATE_CASE_TOKEN_INVALID:{filename}:{count}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Verify repaired browser gates
        run: |
          node scripts/check-lottie-workspace-contract.mjs
          node scripts/check-dotlottie-workspace-contract.mjs
          node scripts/check-batch-contract.mjs

      - name: Commit repair and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-browser-gate-case-repair.yml \
            .github/browser-gate-case-repair.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "test(web): stabilise archive wording gates"
          git pull --rebase origin main
          node scripts/check-lottie-workspace-contract.mjs
          node scripts/check-dotlottie-workspace-contract.mjs
          node scripts/check-batch-contract.mjs
          git push origin HEAD:main
