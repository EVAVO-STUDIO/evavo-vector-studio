name: Inspect Vector bootstrap payload

on:
  push:
    branches:
      - agent/vector-vercel-bootstrap-20260804
    paths:
      - "ops/reviewed/vector-vercel-bootstrap.inspect"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/vector-vercel-bootstrap-20260804
          persist-credentials: false

      - name: Decode and salvage complete tar members
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vector-bootstrap-inspection/recovered
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import zlib
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          payload = root / "ops/reviewed/vector-vercel-bootstrap-payload"
          parts = sorted(payload.glob("part-*.txt"), key=lambda item: item.name)
          encoded = "".join("".join(item.read_text(encoding="ascii").split()) for item in parts)
          decoded = base64.b64decode(encoded, validate=True)
          raw_path = Path("/tmp/vector-bootstrap-inspection/transported.tar.gz")
          raw_path.write_bytes(decoded)

          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          uncompressed = inflater.decompress(decoded)
          try:
              uncompressed += inflater.flush()
          except zlib.error:
              pass
          tar_path = Path("/tmp/vector-bootstrap-inspection/recovered.tar")
          tar_path.write_bytes(uncompressed)

          recovered = []
          rejected = []
          offset = 0
          zero_blocks = 0
          while offset + 512 <= len(uncompressed):
              header = uncompressed[offset:offset + 512]
              offset += 512
              if header == b"\0" * 512:
                  zero_blocks += 1
                  if zero_blocks >= 2:
                      break
                  continue
              zero_blocks = 0
              name = header[0:100].split(b"\0", 1)[0].decode("utf-8", "replace")
              prefix = header[345:500].split(b"\0", 1)[0].decode("utf-8", "replace")
              if prefix:
                  name = f"{prefix}/{name}"
              size_field = header[124:136].split(b"\0", 1)[0].strip() or b"0"
              try:
                  size = int(size_field, 8)
              except ValueError:
                  rejected.append({"member": name, "reason": "invalid-size", "offset": offset - 512})
                  break
              typeflag = header[156:157]
              padded = ((size + 511) // 512) * 512
              if offset + padded > len(uncompressed):
                  rejected.append({
                      "member": name,
                      "reason": "truncated",
                      "expectedBytes": size,
                      "availableBytes": max(0, len(uncompressed) - offset),
                      "offset": offset - 512,
                  })
                  break
              data = uncompressed[offset:offset + size]
              offset += padded
              path = PurePosixPath(name)
              safe = bool(name) and not path.is_absolute() and ".." not in path.parts
              regular = typeflag in (b"\0", b"0", b"7")
              if not safe or not regular:
                  rejected.append({"member": name, "reason": "unsafe-or-non-file", "typeflag": typeflag.decode("ascii", "replace")})
                  continue
              target = Path("/tmp/vector-bootstrap-inspection/recovered") / Path(*path.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              recovered.append({
                  "member": name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          report = {
              "partNames": [item.name for item in parts],
              "encodedLength": len(encoded),
              "decodedBytes": len(decoded),
              "transportedSha256": hashlib.sha256(decoded).hexdigest(),
              "inflatedBytes": len(uncompressed),
              "gzipEof": inflater.eof,
              "unusedDataBytes": len(inflater.unused_data),
              "unconsumedTailBytes": len(inflater.unconsumed_tail),
              "parsedTarBytes": offset,
              "recovered": recovered,
              "rejected": rejected,
          }
          Path("/tmp/vector-bootstrap-inspection/report.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2))
          if not recovered:
              raise SystemExit("No complete safe tar members were recovered")
          PY

      - name: Upload bounded inspection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-bootstrap-payload-inspection-${{ github.sha }}
          path: |
            /tmp/vector-bootstrap-inspection/report.json
            /tmp/vector-bootstrap-inspection/recovered/**
          if-no-files-found: error
          retention-days: 1
