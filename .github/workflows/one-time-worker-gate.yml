name: One-time worker contract integration

on:
  push:
    branches: [main]
    paths:
      - ".github/worker-gate.trigger"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate worker contract gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gate = Path("scripts/check-worker-contract.mjs")
          source = gate.read_text(encoding="utf-8")
          if source.count('  "generatedBodies",\n') != 1:
              raise SystemExit("WORKER_GATE_EVIDENCE_TOKEN_INVALID")
          source = source.replace(
              '  "generatedBodies",\n',
              '  "outputObjects: compactOutputs",\n',
              1,
          )
          if source.count('  "Worker",\n') != 1:
              raise SystemExit("WORKER_GATE_README_TOKEN_INVALID")
          source = source.replace('  "Worker",\n', '  "worker",\n', 1)
          gate.write_text(source, encoding="utf-8")

          workflow = Path(".github/workflows/quality.yml")
          source = workflow.read_text(encoding="utf-8")
          anchor = '''      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
'''
          step = '''      - name: Verify worker execution contract
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          node scripts/check-worker-contract.mjs 2>&1 | tee .ci/worker-contract.log

'''
          if source.count(anchor) != 1 or "Verify worker execution contract" in source:
              raise SystemExit("WORKER_QUALITY_STEP_INVALID")
          workflow.write_text(source.replace(anchor, step + anchor, 1), encoding="utf-8")
          PY
          grep -Fq 'outputObjects: compactOutputs' scripts/check-worker-contract.mjs
          grep -Fq 'Verify worker execution contract' .github/workflows/quality.yml
          git diff --check

      - name: Commit and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-worker-gate.yml \
            .github/worker-gate.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "ci(worker): govern immutable execution engine"
          git pull --rebase origin main
          git push origin HEAD:main
