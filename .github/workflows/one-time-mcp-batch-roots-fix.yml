name: One-time MCP batch root fix

on:
  push:
    branches: [main]
    paths:
      - ".github/mcp-batch-roots-fix.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-mcp-batch-roots-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align batch tools with canonical MCP roots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("packages/mcp/src/batch-tools.ts")
          source = target.read_text(encoding="utf-8")
          count = source.count("pathPolicy.allowedRoots")
          if count != 4:
              raise SystemExit(f"BATCH_ROOT_PROPERTY_COUNT_INVALID:{count}")
          source = source.replace("pathPolicy.allowedRoots", "pathPolicy.roots")
          target.write_text(source, encoding="utf-8")
          PY
          grep -Fq 'pathPolicy.roots.some' packages/mcp/src/batch-tools.ts
          grep -Fq 'allowedRoots: pathPolicy.roots' packages/mcp/src/batch-tools.ts
          if grep -Fq 'pathPolicy.allowedRoots' packages/mcp/src/batch-tools.ts; then
            exit 1
          fi
          git diff --check

      - name: Commit fix and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-mcp-batch-roots-fix.yml \
            .github/mcp-batch-roots-fix.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(mcp): use canonical batch root contract"
          git pull --rebase origin main
          git push origin HEAD:main
