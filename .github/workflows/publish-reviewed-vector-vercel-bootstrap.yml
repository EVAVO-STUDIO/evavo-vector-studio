name: Publish reviewed Vector Vercel bootstrap

on:
  push:
    branches:
      - agent/vector-vercel-bootstrap-20260804
    paths:
      - "ops/reviewed/vector-vercel-bootstrap.ready"

permissions:
  contents: write
  statuses: write

concurrency:
  group: publish-reviewed-vector-vercel-bootstrap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/vector-vercel-bootstrap-20260804
          fetch-depth: 40
          persist-credentials: true

      - name: Use repository Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Apply reviewed bootstrap payload
        id: patch
        continue-on-error: true
        shell: bash
        env:
          PAYLOAD_COMMIT: 7cc1981d4879b05b774f71e6c2393a9147ca8411
          PAYLOAD_SHA256: c66389cb336a2707e1d3ee499cc8fe465c4dd369da549ff97fb694615eb93b4b
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          import re
          import subprocess
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          source_commit = os.environ["PAYLOAD_COMMIT"]
          expected_digest = os.environ["PAYLOAD_SHA256"]
          payload_paths = [
              "ops/reviewed/vector-vercel-bootstrap-payload/part-01.txt",
              "ops/reviewed/vector-vercel-bootstrap-payload/part-02.txt",
              "ops/reviewed/vector-vercel-bootstrap-payload/part-03.txt",
              "ops/reviewed/vector-vercel-bootstrap-payload/part-04.txt",
              "ops/reviewed/vector-vercel-bootstrap-payload/part-05.txt",
          ]

          encoded_parts = []
          for relative_path in payload_paths:
              completed = subprocess.run(
                  ["git", "show", f"{source_commit}:{relative_path}"],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              text = completed.stdout.decode("ascii")
              compact = "".join(text.split())
              if not compact:
                  raise SystemExit(f"Empty historical payload part: {relative_path}")
              if re.fullmatch(r"[A-Za-z0-9+/]*={0,2}", compact) is None:
                  invalid = sorted(set(re.sub(r"[A-Za-z0-9+/=]", "", compact)))
                  raise SystemExit(
                      f"Non-base64 historical payload characters in {relative_path}: {invalid}"
                  )
              encoded_parts.append(compact)

          encoded = "".join(encoded_parts)
          decoded = None
          if len(encoded) % 4 == 3:
              matches = []
              alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="
              for candidate in alphabet:
                  trial = encoded + candidate
                  if "=" in trial[:-2]:
                      continue
                  try:
                      value = base64.b64decode(trial, validate=True)
                  except Exception:
                      continue
                  if hashlib.sha256(value).hexdigest() == expected_digest:
                      matches.append((candidate, value))
              if len(matches) != 1:
                  raise SystemExit(
                      f"Expected one hash-bound tail recovery, found {len(matches)} for historical length {len(encoded)}"
                  )
              recovered_character, decoded = matches[0]
              print(
                  f"Recovered one omitted historical base64 tail character using the reviewed SHA-256 ({ord(recovered_character)})."
              )
          elif len(encoded) % 4 == 0:
              if "=" in encoded[:-2]:
                  raise SystemExit("Historical base64 padding appeared before the final quartet")
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except Exception as error:
                  raise SystemExit(
                      f"Historical base64 validation failed at length {len(encoded)}: {error}"
                  ) from error
              if hashlib.sha256(decoded).hexdigest() != expected_digest:
                  raise SystemExit(
                      f"Historical payload digest mismatch at encoded length {len(encoded)}"
                  )
          else:
              raise SystemExit(
                  f"Historical base64 requires more than one recovery character: {len(encoded)}"
              )

          if decoded is None or hashlib.sha256(decoded).hexdigest() != expected_digest:
              raise SystemExit("Recovered payload did not match the reviewed SHA-256")

          archive_path = Path("/tmp/vector-vercel-bootstrap.tar.gz")
          archive_path.write_bytes(decoded)
          with tarfile.open(archive_path, "r:gz") as archive:
              members = archive.getmembers()
              if not members:
                  raise SystemExit("Reviewed bootstrap archive is empty")
              for member in members:
                  if (
                      not member.isfile()
                      or member.name.startswith("/")
                      or ".." in Path(member.name).parts
                  ):
                      raise SystemExit(f"Unsafe archive member: {member.name}")
                  target = (root / member.name).resolve()
                  target.relative_to(root)
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f"Missing archive body: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(source.read())
          PY
          rm -f .github/workflows/export-exact-source.yml
          rm -f ops/reviewed/export-exact-source.ready
          rm -f .github/workflows/publish-reviewed-vector-vercel-bootstrap.yml
          rm -f ops/reviewed/vector-vercel-bootstrap.ready
          rm -rf ops/reviewed/vector-vercel-bootstrap-payload

      - name: Verify exact reviewed changeset
        id: changeset
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/export-exact-source.yml
          test ! -e ops/reviewed/export-exact-source.ready
          test ! -e .github/workflows/publish-reviewed-vector-vercel-bootstrap.yml
          test ! -e ops/reviewed/vector-vercel-bootstrap.ready
          test ! -e ops/reviewed/vector-vercel-bootstrap-payload

      - name: Activate exact pnpm through Corepack
        id: pnpm
        if: steps.changeset.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"

      - name: Run dependency-free contracts and self-tests
        id: source
        if: steps.pnpm.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for check in scripts/check-*.mjs; do node "$check"; done
          node scripts/resolve-provider-control-request.mjs --self-test
          node scripts/provision-vector-studio-vercel.mjs --self-test
          node scripts/deploy-vector-studio-vercel.mjs --self-test
          node scripts/verify-live-capability-discovery.mjs --self-test

      - name: Install exact dependencies
        id: install
        if: steps.source.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Run exhaustive quality validation
        id: quality
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --check

      - name: Publish reviewed source changes
        id: publish
        if: steps.quality.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO reviewed publisher"
          git config user.email "evavo.studio@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(release): harden Vector provider control and Vercel bootstrap"
          git push origin HEAD:agent/vector-vercel-bootstrap-20260804

      - name: Publish final validation status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          CHANGESET_OUTCOME: ${{ steps.changeset.outcome }}
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          script: |
            const outcomes = [
              process.env.PATCH_OUTCOME,
              process.env.CHANGESET_OUTCOME,
              process.env.PNPM_OUTCOME,
              process.env.SOURCE_OUTCOME,
              process.env.INSTALL_OUTCOME,
              process.env.QUALITY_OUTCOME,
              process.env.PUBLISH_OUTCOME,
            ];
            const passed = outcomes.every((value) => value === "success");
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "ci/vector-vercel-bootstrap-review",
              description: passed
                ? "reviewed provider control and Vercel bootstrap published"
                : "reviewed Vector Vercel bootstrap publication failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce publication result
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          CHANGESET_OUTCOME: ${{ steps.changeset.outcome }}
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          test "$PATCH_OUTCOME" = "success"
          test "$CHANGESET_OUTCOME" = "success"
          test "$PNPM_OUTCOME" = "success"
          test "$SOURCE_OUTCOME" = "success"
          test "$INSTALL_OUTCOME" = "success"
          test "$QUALITY_OUTCOME" = "success"
          test "$PUBLISH_OUTCOME" = "success"
