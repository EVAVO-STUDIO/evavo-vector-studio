name: Publish reviewed Vector provider hardening

on:
  push:
    branches:
      - agent/vector-provider-hardening-20260806
    paths:
      - "ops/reviewed/vector-provider-hardening.ready"

permissions:
  contents: write
  statuses: write

concurrency:
  group: publish-reviewed-vector-provider-hardening
  cancel-in-progress: false

env:
  REVIEWED_BASE_SHA: 056e538e804f452f84b4f532e9042fd475378b8f
  VALIDATED_BRANCH: agent/vector-provider-hardening-blobs-20260806
  PATCH_SHA256: df520753dd1fdf58f2f20568c0152bafeebc81cba4af031d175b34d8b945cd47

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact reviewed transport branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/vector-provider-hardening-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Use repository Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Materialize reviewed patch on exact current main
        shell: bash
        run: |
          set -euo pipefail
          cp ops/reviewed/vector-provider-hardening.patch.gz.b64 /tmp/vector-provider-hardening.patch.gz.b64

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$REVIEWED_BASE_SHA"
          git checkout --force -B "$VALIDATED_BRANCH" "$REVIEWED_BASE_SHA"

          base64 --decode /tmp/vector-provider-hardening.patch.gz.b64 \
            | gzip -dc > /tmp/vector-provider-hardening.patch
          test "$(sha256sum /tmp/vector-provider-hardening.patch | cut -d' ' -f1)" = "$PATCH_SHA256"
          git apply --check /tmp/vector-provider-hardening.patch
          git apply /tmp/vector-provider-hardening.patch

          git add \
            .github/workflows/vector-vercel-production-deployment.yml \
            .github/workflows/vector-vercel-project-provisioning.yml \
            .github/workflows/vercel-deployment-contract.yml \
            apps/web/public/hub/evavo-vector-studio.deployment.json \
            docs/PROVIDER-CONTROL.md \
            docs/VERCEL-DEPLOYMENT.md \
            scripts/check-vercel-deployment-contract.mjs \
            scripts/check-vercel-production-deployment-contract.mjs \
            scripts/check-vercel-project-provisioning-contract.mjs \
            scripts/deploy-vector-studio-vercel.mjs \
            scripts/provision-vector-studio-vercel.mjs

          git diff --cached --check
          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/vector-vercel-production-deployment.yml",
              ".github/workflows/vector-vercel-project-provisioning.yml",
              ".github/workflows/vercel-deployment-contract.yml",
              "apps/web/public/hub/evavo-vector-studio.deployment.json",
              "docs/PROVIDER-CONTROL.md",
              "docs/VERCEL-DEPLOYMENT.md",
              "scripts/check-vercel-deployment-contract.mjs",
              "scripts/check-vercel-production-deployment-contract.mjs",
              "scripts/check-vercel-project-provisioning-contract.mjs",
              "scripts/deploy-vector-studio-vercel.mjs",
              "scripts/provision-vector-studio-vercel.mjs",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"Unexpected reviewed changeset. Missing={sorted(expected-actual)} Extra={sorted(actual-expected)}"
              )
          PY
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Run provider contracts and self-tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-lockfile-integrity.mjs
          node scripts/check-vercel-deployment-contract.mjs
          node scripts/check-vercel-project-provisioning-contract.mjs
          node scripts/check-vercel-production-deployment-contract.mjs
          node scripts/provision-vector-studio-vercel.mjs --self-test
          node scripts/plan-vector-studio-vercel-provisioning.mjs --self-test
          node scripts/deploy-vector-studio-vercel.mjs --self-test
          git diff --exit-code
          git diff --cached --check

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run exhaustive repository validation
        shell: bash
        run: |
          set -euo pipefail
          pnpm check
          git diff --exit-code
          git diff --cached --check

      - name: Publish validated non-workflow blobs
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          git restore --source="$REVIEWED_BASE_SHA" --staged --worktree -- \
            .github/workflows/vector-vercel-production-deployment.yml \
            .github/workflows/vector-vercel-project-provisioning.yml \
            .github/workflows/vercel-deployment-contract.yml

          python - <<'PY'
          import subprocess

          expected = {
              "apps/web/public/hub/evavo-vector-studio.deployment.json",
              "docs/PROVIDER-CONTROL.md",
              "docs/VERCEL-DEPLOYMENT.md",
              "scripts/check-vercel-deployment-contract.mjs",
              "scripts/check-vercel-production-deployment-contract.mjs",
              "scripts/check-vercel-project-provisioning-contract.mjs",
              "scripts/deploy-vector-studio-vercel.mjs",
              "scripts/provision-vector-studio-vercel.mjs",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"Unexpected blob-export changeset. Missing={sorted(expected-actual)} Extra={sorted(actual-expected)}"
              )
          PY
          git diff --cached --check
          git diff --exit-code

          git config user.name "EVAVO reviewed publisher"
          git config user.email "evavo.studio@gmail.com"
          git commit -m "feat(release): materialize validated Vector provider blobs"
          published_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$VALIDATED_BRANCH"
          remote_sha="$(git ls-remote origin "refs/heads/$VALIDATED_BRANCH" | cut -f1)"
          test "$remote_sha" = "$published_sha"
          echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"

      - name: Publish successful blob-validation status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        with:
          script: |
            if (!/^[a-f0-9]{40}$/.test(process.env.PUBLISHED_SHA || "")) {
              core.setFailed("Validated provider blob commit SHA was not produced");
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PUBLISHED_SHA,
              state: "success",
              context: "ci/vector-provider-hardening-blobs",
              description: "provider source blobs validated against complete reviewed tree",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
