name: One-time object transfer gate correction

on:
  push:
    branches: [main]
    paths:
      - ".github/object-transfer-gate-fix.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct public-path gate assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("scripts/check-object-transfer-api-contract.mjs")
          source = target.read_text(encoding="utf-8")
          old = '''forbidTokens(files.runtime, sources.runtime, [
            'mode: "memory"',
            "objectTransferAvailable: true,\n    reason:",
          ]);'''
          new = '''forbidTokens(files.runtime, sources.runtime, [
            'mode: "memory"',
          ]);'''
          if source.count(old) != 1:
              raise SystemExit(f"RUNTIME_FORBID_ANCHOR_INVALID:{source.count(old)}")
          source = source.replace(old, new, 1)
          old = '''forbidTokens(files.helpers, sources.helpers, [
            "storePath",
            "rootPath",
            "temporaryPath",
            '"content-type": object.mimeType',
          ]);'''
          new = '''forbidTokens(files.helpers, sources.helpers, [
            "rootPath",
            "temporaryPath",
            '"content-type": object.mimeType',
          ]);'''
          if source.count(old) != 1:
              raise SystemExit(f"HELPER_FORBID_ANCHOR_INVALID:{source.count(old)}")
          target.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit correction and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-object-transfer-gate-fix.yml \
            .github/object-transfer-gate-fix.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "test(object-transfer): correct public path assertions"
          git pull --rebase origin main
          git push origin HEAD:main
