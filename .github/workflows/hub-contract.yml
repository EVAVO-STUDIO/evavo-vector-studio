name: EVAVO hub integration contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: vector-studio-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify EVAVO hub integration contract
        run: node scripts/check-hub-integration-contract.mjs

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Execute hub authentication tests
        run: pnpm --filter @evavo/hub-auth test

      - name: Typecheck private web boundary
        run: pnpm --filter @evavo/vector-web typecheck

      - name: Build private web application
        run: pnpm --filter @evavo/vector-web build

      # BEGIN ONE-TIME DETERMINISTIC LOCKFILE PUBLICATION
      - name: Publish deterministic pnpm lockfile and restore read-only workflow
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('pnpm-lock.yaml') == '' }}
        shell: bash
        run: |
          set -euo pipefail

          repository_root="$PWD"
          candidate_a="$(mktemp -d)"
          candidate_b="$(mktemp -d)"
          trap 'rm -rf "$candidate_a" "$candidate_b"' EXIT

          git archive --format=tar HEAD | tar -xf - -C "$candidate_a"
          git archive --format=tar HEAD | tar -xf - -C "$candidate_b"

          for candidate in "$candidate_a" "$candidate_b"; do
            (
              cd "$candidate"
              rm -f pnpm-lock.yaml
              pnpm install --lockfile-only --ignore-scripts
            )
          done

          cmp --silent "$candidate_a/pnpm-lock.yaml" "$candidate_b/pnpm-lock.yaml" || {
            echo "PNPM_LOCKFILE_NOT_DETERMINISTIC" >&2
            exit 1
          }

          cp "$candidate_a/pnpm-lock.yaml" "$repository_root/pnpm-lock.yaml"
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/hub-contract.yml')
          source = workflow.read_text(encoding='utf-8')
          source = source.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          source = source.replace('    timeout-minutes: 30\n', '    timeout-minutes: 15\n', 1)
          start_marker = '      # BEGIN ONE-TIME DETERMINISTIC LOCKFILE PUBLICATION\n'
          end_marker = '      # END ONE-TIME DETERMINISTIC LOCKFILE PUBLICATION\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('LOCKFILE_WORKFLOW_RESTORE_MARKERS_MISSING')
          end += len(end_marker)
          source = source[:start] + source[end:]
          workflow.write_text(source, encoding='utf-8')
          PY

          rm -f \
            .github/workflows/one-time-pnpm-lockfile.yml \
            .github/pnpm-lockfile.trigger

          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add \
            pnpm-lock.yaml \
            .github/workflows/hub-contract.yml \
            .github/workflows/one-time-pnpm-lockfile.yml \
            .github/pnpm-lockfile.trigger
          git diff --cached --check
          git commit -m "build(release): publish deterministic pnpm lockfile"
          git pull --rebase origin main
          git push origin HEAD:main
      # END ONE-TIME DETERMINISTIC LOCKFILE PUBLICATION
