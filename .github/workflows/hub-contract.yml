name: EVAVO hub integration contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-studio-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify lockfile integrity
        run: node scripts/check-lockfile-integrity.mjs

      - name: Verify EVAVO hub integration contract
        run: node scripts/check-hub-integration-contract.mjs

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the private web dependency graph
        run: pnpm exec turbo run build --filter=@evavo/vector-web

      - name: Execute hub authentication tests
        run: pnpm --filter @evavo/hub-auth test

      - name: Typecheck the private web boundary
        run: pnpm --filter @evavo/vector-web typecheck

      - name: Verify no tracked source mutation
        run: git diff --exit-code
