name: Export exact Vector Studio source

on:
  push:
    branches:
      - main
    paths:
      - "ops/reviewed/export-exact-source.ready"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: export-exact-vector-source
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact current main and package tracked source
        id: package
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p /tmp/vector-source
          printf '%s\n' "${GITHUB_SHA}" > /tmp/vector-source/COMMIT_SHA
          git archive --format=zip --output="/tmp/vector-source/evavo-vector-studio-${GITHUB_SHA}.zip" HEAD
          sha256sum "/tmp/vector-source/evavo-vector-studio-${GITHUB_SHA}.zip" > /tmp/vector-source/SHA256SUMS

      - name: Upload exact source archive
        id: upload
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evavo-vector-studio-source-${{ github.sha }}
          path: /tmp/vector-source/*
          if-no-files-found: error
          retention-days: 1

      - name: Publish exact-source export status
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        with:
          script: |
            const passed =
              process.env.CHECKOUT_OUTCOME === "success" &&
              process.env.PACKAGE_OUTCOME === "success" &&
              process.env.UPLOAD_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "ci/vector-exact-source-export",
              description: passed
                ? "exact tracked Vector source exported"
                : "exact Vector source export failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce exact-source export
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          test "$CHECKOUT_OUTCOME" = "success"
          test "$PACKAGE_OUTCOME" = "success"
          test "$UPLOAD_OUTCOME" = "success"
