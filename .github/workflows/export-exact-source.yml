name: Export exact Vector Studio source

on:
  push:
    branches:
      - main
    paths:
      - "ops/reviewed/export-exact-source.ready"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-exact-vector-source
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact current main and package tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git diff --exit-code
          git status --porcelain=v1 --untracked-files=all | test ! -s /dev/stdin
          mkdir -p /tmp/vector-source
          printf '%s\n' "${GITHUB_SHA}" > /tmp/vector-source/COMMIT_SHA
          git archive --format=zip --output="/tmp/vector-source/evavo-vector-studio-${GITHUB_SHA}.zip" HEAD
          sha256sum "/tmp/vector-source/evavo-vector-studio-${GITHUB_SHA}.zip" > /tmp/vector-source/SHA256SUMS

      - name: Upload exact source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evavo-vector-studio-source-${{ github.sha }}
          path: /tmp/vector-source/*
          if-no-files-found: error
          retention-days: 1
