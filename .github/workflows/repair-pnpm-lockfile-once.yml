name: Repair pnpm lockfile safely

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-pnpm-lockfile-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: vector-pnpm-lockfile-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Use Node.js 22 without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          corepack enable 2>&1 | tee .ci/pnpm-bootstrap.log
          corepack prepare pnpm@10.14.0 --activate 2>&1 | tee -a .ci/pnpm-bootstrap.log
          version="$(pnpm --version)"
          printf 'pnpm %s\n' "$version" | tee -a .ci/pnpm-bootstrap.log
          test "$version" = "10.14.0"
          git diff --exit-code

      - name: Capture immutable dependency inputs
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-lockfile-integrity.mjs | tee .ci/lockfile-integrity-before.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          manifests = sorted(
              path for path in Path(".").rglob("package.json")
              if "node_modules" not in path.parts and ".git" not in path.parts
          )
          if len(manifests) != 17:
              raise SystemExit(
                  f"Expected 17 workspace package manifests; found {len(manifests)}."
              )
          evidence = {
              "check": "pnpm-lockfile-repair-inputs",
              "ok": True,
              "packageManager": "pnpm@10.14.0",
              "manifestCount": len(manifests),
              "manifests": [
                  {
                      "path": str(path),
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in manifests
              ],
              "lockfileSha256": hashlib.sha256(
                  Path("pnpm-lock.yaml").read_bytes()
              ).hexdigest(),
          }
          Path(".ci/lockfile-repair-inputs.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Try checked-in frozen dependency graph
        id: initial_install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci/initial-frozen-install.log

      - name: Regenerate only when the checked-in graph is unusable
        id: regenerate
        if: ${{ steps.initial_install.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          cp pnpm-lock.yaml .ci/pnpm-lock.original.yaml
          rm -f pnpm-lock.yaml
          rm -rf node_modules
          find apps packages workers -type d -name node_modules -prune -exec rm -rf '{}' + 2>/dev/null || true
          pnpm install --lockfile-only --no-frozen-lockfile 2>&1 | tee .ci/lockfile-regeneration.log
          cp pnpm-lock.yaml .ci/pnpm-lock.generated.yaml
          node scripts/check-lockfile-integrity.mjs | tee .ci/lockfile-integrity-after.json
          echo "regenerated=true" >> "$GITHUB_OUTPUT"

      - name: Prove the retained or regenerated graph is frozen-installable
        id: frozen_install
        if: ${{ !cancelled() && (steps.initial_install.outcome == 'success' || steps.regenerate.outcome == 'success') }}
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci/final-frozen-install.log

      - name: Verify manifests are unchanged and mutation is lockfile-only
        id: scope
        if: ${{ !cancelled() && steps.frozen_install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          before = json.loads(
              Path(".ci/lockfile-repair-inputs.json").read_text(encoding="utf-8")
          )
          expected = {
              item["path"]: item["sha256"]
              for item in before["manifests"]
          }
          current = {
              str(path): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(
                  path for path in Path(".").rglob("package.json")
                  if "node_modules" not in path.parts and ".git" not in path.parts
              )
          }
          if current != expected:
              raise SystemExit("A package manifest changed during lockfile recovery.")
          PY
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            test "$changed" = "pnpm-lock.yaml"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- pnpm-lock.yaml
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit a verified regenerated lockfile directly to main
        id: commit
        if: ${{ steps.scope.outcome == 'success' && steps.scope.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EVAVO Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(build): regenerate deterministic pnpm lockfile"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve validated main SHA
        id: resolved
        if: ${{ !cancelled() && steps.scope.outcome == 'success' && (steps.commit.outcome == 'success' || steps.commit.outcome == 'skipped') }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.commit.outputs.sha }}"
          if [ -z "$sha" ]; then
            sha="$(git rev-parse HEAD)"
          fi
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Preserve bounded recovery diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-lockfile-recovery-${{ github.sha }}
          path: .ci/*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Publish lockfile recovery status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESOLVED_SHA: ${{ steps.resolved.outputs.sha }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          INITIAL_INSTALL_OUTCOME: ${{ steps.initial_install.outcome }}
          REGENERATE_OUTCOME: ${{ steps.regenerate.outcome }}
          FROZEN_INSTALL_OUTCOME: ${{ steps.frozen_install.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RESOLVED_OUTCOME: ${{ steps.resolved.outcome }}
        with:
          script: |
            const dependencyGraphAccepted =
              process.env.INITIAL_INSTALL_OUTCOME === "success" ||
              process.env.REGENERATE_OUTCOME === "success";
            const commitAccepted = ["success", "skipped"].includes(
              process.env.COMMIT_OUTCOME,
            );
            const passed =
              process.env.TOOLCHAIN_OUTCOME === "success" &&
              process.env.CAPTURE_OUTCOME === "success" &&
              dependencyGraphAccepted &&
              process.env.FROZEN_INSTALL_OUTCOME === "success" &&
              process.env.SCOPE_OUTCOME === "success" &&
              commitAccepted &&
              process.env.RESOLVED_OUTCOME === "success";
            const candidate = String(process.env.RESOLVED_SHA || "").trim();
            const sha = /^[a-f0-9]{40}$/.test(candidate)
              ? candidate
              : context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: passed ? "success" : "failure",
              context: "vector/lockfile-repair",
              description: passed
                ? "Corepack bootstrap and frozen dependency graph verified"
                : "lockfile recovery did not complete",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Dispatch complete validation on verified main
        if: ${{ steps.resolved.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const workflow_id of ["quality.yml", "print-preflight-contract.yml"]) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id,
                ref: "main",
              });
            }

      - name: Enforce recovery result
        if: always()
        shell: bash
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          INITIAL_INSTALL_OUTCOME: ${{ steps.initial_install.outcome }}
          REGENERATE_OUTCOME: ${{ steps.regenerate.outcome }}
          FROZEN_INSTALL_OUTCOME: ${{ steps.frozen_install.outcome }}
          SCOPE_OUTCOME: ${{ steps.scope.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          RESOLVED_OUTCOME: ${{ steps.resolved.outcome }}
        run: |
          test "$TOOLCHAIN_OUTCOME" = "success"
          test "$CAPTURE_OUTCOME" = "success"
          test "$INITIAL_INSTALL_OUTCOME" = "success" -o "$REGENERATE_OUTCOME" = "success"
          test "$FROZEN_INSTALL_OUTCOME" = "success"
          test "$SCOPE_OUTCOME" = "success"
          test "$COMMIT_OUTCOME" = "success" -o "$COMMIT_OUTCOME" = "skipped"
          test "$RESOLVED_OUTCOME" = "success"
