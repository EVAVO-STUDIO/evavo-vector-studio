name: One-time HTTP worker promotion

on:
  push:
    branches: [main]
    paths:
      - ".github/http-worker-promotion.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-http-worker-promotion
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote HTTP worker into permanent contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, code: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{code}:{count}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")

          replace_once(
              ".github/workflows/quality.yml",
              "      - name: Install dependencies\n",
              "      - name: Verify HTTP-coordinated worker contract\n"
              "        if: ${{ !cancelled() }}\n"
              "        shell: bash\n"
              "        run: |\n"
              "          mkdir -p .ci\n"
              "          set -o pipefail\n"
              "          node scripts/check-http-worker-contract.mjs 2>&1 | tee .ci/http-worker-contract.log\n\n"
              "      - name: Install dependencies\n",
              "QUALITY_HTTP_GATE_ANCHOR_INVALID",
          )

          readme_section = '''### HTTP-coordinated worker execution

          The `evavo-vector-http-worker` process coordinates leases through the authenticated Worker Control API while executing against a trusted shared immutable object store.

          - one-shot `http-worker:run-once` and polling `http-worker:run` modes;
          - HTTPS required for non-local control URLs unless insecure HTTP is explicitly enabled;
          - independent `VECTOR_WORKER_API_TOKEN` authentication;
          - bounded heartbeat and completion-reconciliation policies;
          - exact receipt-backed completion replay after a lost response;
          - `control-uncertain` rather than false failure when completion cannot be confirmed;
          - generated bodies kept outside HTTP control responses and process output;
          - `objectTransferAvailable: false`, `queueDeliveryAvailable: false` and `managedRemoteExecutionAvailable: false`.

          ```powershell
          $env:VECTOR_WORKER_CONTROL_URL = "https://vector.evavo.com.au"
          $env:VECTOR_WORKER_API_TOKEN = "replace-with-a-worker-only-secret"
          $env:VECTOR_OBJECT_STORE_PATH = "C:\\EVAVO\\VectorWorker\\objects"
          $env:VECTOR_WORKER_ID = "greg-workstation-01"

          pnpm http-worker:capabilities
          pnpm http-worker:run-once
          pnpm http-worker:run -- --idle-exit-ms 30000
          ```

          See [`docs/HTTP-WORKER.md`](docs/HTTP-WORKER.md).

          '''
          # Remove Python source indentation retained inside the triple-quoted block.
          readme_section = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in readme_section.splitlines()
          ) + "\n"
          replace_once(
              "README.md",
              "## Quick start on Windows PowerShell\n",
              readme_section + "## Quick start on Windows PowerShell\n",
              "README_HTTP_SECTION_ANCHOR_INVALID",
          )
          replace_once(
              "README.md",
              "workers/local-worker      local lease processor and machine-readable CLI\n",
              "packages/worker-client    bounded secret-safe worker control client\n"
              "workers/local-worker      local lease processor and machine-readable CLI\n"
              "workers/http-worker       HTTP-coordinated shared-store worker\n",
              "README_LAYOUT_ANCHOR_INVALID",
          )
          replace_once(
              "README.md",
              "- [`docs/WORKER-API.md`](docs/WORKER-API.md)\n",
              "- [`docs/WORKER-API.md`](docs/WORKER-API.md)\n"
              "- [`docs/WORKER-CLIENT.md`](docs/WORKER-CLIENT.md)\n"
              "- [`docs/HTTP-WORKER.md`](docs/HTTP-WORKER.md)\n",
              "README_DOCS_ANCHOR_INVALID",
          )

          architecture_section = '''### HTTP-coordinated worker

          `@evavo/http-worker` combines the bounded `@evavo/worker-client`, the governed worker executor and a trusted immutable object store. It acquires and starts leases over HTTP, renews heartbeats, observes cancellation, executes the same five production operations and returns receipt-only completion evidence.

          The worker can explicitly replay only receipt-backed completion after transport uncertainty. `completeHostedJobIdempotently` returns an exact retained terminal record unchanged and rejects changed receipts or evidence as `HOSTED_JOB_COMPLETION_CONFLICT`. When completion remains unknowable after the bounded replay budget, the process reports `HTTP_WORKER_COMPLETION_UNCERTAIN` and does not falsely fail a job whose objects may already be committed.

          HTTP coordination is available. Object transfer, queue delivery, distributed storage guarantees and managed remote execution remain unavailable. The API and worker currently require trusted access to the same immutable object namespace.

          '''
          architecture_section = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in architecture_section.splitlines()
          ) + "\n"
          replace_once(
              "docs/ARCHITECTURE.md",
              "## Evidence and approval\n",
              architecture_section + "## Evidence and approval\n",
              "ARCHITECTURE_HTTP_SECTION_ANCHOR_INVALID",
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "- a local worker retained exact input and output receipts under a valid lease.\n",
              "- a local worker retained exact input and output receipts under a valid lease;\n"
              "- an HTTP-coordinated worker retained exact completion identity across a lost response.\n",
              "ARCHITECTURE_EVIDENCE_ANCHOR_INVALID",
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "- local execution proves distributed deployment readiness.\n",
              "- local execution proves distributed deployment readiness;\n"
              "- HTTP coordination proves object transfer, queue delivery or managed remote deployment.\n",
              "ARCHITECTURE_NONCLAIM_ANCHOR_INVALID",
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "- local worker outputs commit atomically with no-overwrite semantics;\n",
              "- local worker outputs commit atomically with no-overwrite semantics;\n"
              "- worker control uses a separate server-only token and redacted lease records;\n"
              "- HTTP completion replay accepts only exact retained receipts and evidence;\n",
              "ARCHITECTURE_SECURITY_ANCHOR_INVALID",
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "The repository now has restartable local batch execution, a provider-neutral hosted job record control plane and an executable local worker. A released hosted EVAVO application still needs:\n",
              "The repository now has restartable local batch execution, a provider-neutral hosted job record control plane, an executable local worker and an HTTP-coordinated shared-store worker. A released hosted EVAVO application still needs:\n",
              "ARCHITECTURE_DEPLOYMENT_ANCHOR_INVALID",
          )

          hosted_section = '''## HTTP-coordinated worker

          A separately deployed `evavo-vector-http-worker` can acquire leases through the Worker Control API and execute the same governed operations against a trusted shared immutable object store.

          ```powershell
          $env:VECTOR_WORKER_CONTROL_URL = "https://vector.evavo.com.au"
          $env:VECTOR_WORKER_API_TOKEN = "replace-with-a-worker-only-secret"
          $env:VECTOR_OBJECT_STORE_PATH = "C:\\EVAVO\\VectorWorker\\objects"
          pnpm http-worker:run
          ```

          Receipt-backed completion is replay-safe. An exact repeated completion returns the retained record without increasing its version. Different receipts or evidence fail as `HOSTED_JOB_COMPLETION_CONFLICT`. A worker that commits objects but cannot confirm completion reports `HTTP_WORKER_COMPLETION_UNCERTAIN` instead of submitting a contradictory failure transition.

          This surface coordinates execution but does not provide object transfer, queue delivery, autoscaling or managed remote execution. See [`HTTP-WORKER.md`](HTTP-WORKER.md).

          '''
          hosted_section = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in hosted_section.splitlines()
          ) + "\n"
          replace_once(
              "docs/HOSTED-JOBS.md",
              "## Worker boundary\n",
              hosted_section + "## Worker boundary\n",
              "HOSTED_HTTP_ANCHOR_INVALID",
          )

          replace_once(
              "docs/API.md",
              "Completion accepts at least one output receipt and compact evidence. Generated raster, SVG, Lottie or archive bodies are never accepted as a substitute for object storage.\n",
              "Completion accepts at least one output receipt and compact evidence. Generated raster, SVG, Lottie or archive bodies are never accepted as a substitute for object storage.\n\n"
              "Exact receipt-backed completion replay is idempotent. A changed replay fails with `HOSTED_JOB_COMPLETION_CONFLICT`, allowing an HTTP worker to reconcile a lost response without duplicating immutable output.\n",
              "API_COMPLETION_REPLAY_ANCHOR_INVALID",
          )
          replace_once(
              "docs/API.md",
              "# Shared approval boundary\n",
              "The `evavo-vector-http-worker` consumes this control API while reading and writing a trusted shared immutable object store. It performs bounded heartbeats and completion reconciliation but does not claim HTTP object transfer or managed queue execution. See [`HTTP-WORKER.md`](HTTP-WORKER.md).\n\n"
              "# Shared approval boundary\n",
              "API_HTTP_WORKER_ANCHOR_INVALID",
          )

          replace_once(
              "scripts/check-release-contract.mjs",
              '  "packages/cli/package.json",\n',
              '  "packages/job-engine/package.json",\n'
              '  "packages/job-control/package.json",\n'
              '  "packages/worker-engine/package.json",\n'
              '  "packages/worker-protocol/package.json",\n'
              '  "packages/worker-client/package.json",\n'
              '  "packages/vector-jobs/package.json",\n'
              '  "workers/local-worker/package.json",\n'
              '  "workers/http-worker/package.json",\n'
              '  "packages/cli/package.json",\n',
              "RELEASE_PACKAGE_LIST_ANCHOR_INVALID",
          )
          PY
          grep -Fq 'Verify HTTP-coordinated worker contract' .github/workflows/quality.yml
          grep -Fq 'HTTP-coordinated worker execution' README.md
          grep -Fq 'HTTP_WORKER_COMPLETION_UNCERTAIN' docs/ARCHITECTURE.md
          grep -Fq 'HOSTED_JOB_COMPLETION_CONFLICT' docs/API.md
          grep -Fq 'workers/http-worker/package.json' scripts/check-release-contract.mjs
          git diff --check

      - name: Commit promotion and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-http-worker-promotion.yml \
            .github/http-worker-promotion.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "docs(http-worker): promote coordinated execution surface"
          git pull --rebase origin main
          git push origin HEAD:main
