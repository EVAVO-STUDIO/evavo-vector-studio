name: Vector Studio exact production deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan without mutation or deploy the exact current main commit
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      commit:
        description: Exact lowercase 40-character current main commit
        required: true
        type: string
      confirmation:
        description: "Apply only: deploy-evavo-vector-studio"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-exact-production-deployment
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ inputs.mode == 'plan' }}
    environment: vector-studio-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact current main
        id: current_main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            core.setOutput("sha", data.commit.sha);

      - name: Confirm exact current main
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.current_main.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The deployment commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi
          test "$CURRENT_MAIN_SHA" = "${{ inputs.commit }}"
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"

      - name: Use the repository Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify lockfile integrity
        run: node scripts/check-lockfile-integrity.mjs

      - name: Verify exact deployer and live-proof self-tests
        run: |
          node scripts/deploy-vector-studio-vercel.mjs --self-test
          node scripts/plan-vector-studio-vercel-provisioning.mjs --self-test
          node scripts/create-vector-live-launch-token.mjs --self-test
          node scripts/verify-live-capability-discovery.mjs --self-test

      - name: Create bounded no-mutation deployment plan
        id: deployment
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .ci
          node scripts/deploy-vector-studio-vercel.mjs \
            --mode plan \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-production-plan.json

      - name: Preserve bounded deployment plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-vercel-production-plan-${{ inputs.commit }}
          path: .ci/vector-vercel-production-plan.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Publish deployment plan status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        with:
          script: |
            const passed = process.env.DEPLOYMENT_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ inputs.commit }}",
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-production-plan",
              description: passed
                ? "exact production deployment plan passed without mutation"
                : "Vector Studio exact production deployment plan failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce deployment plan result
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: test "$DEPLOYMENT_OUTCOME" = "success"

  apply:
    if: ${{ inputs.mode == 'apply' }}
    environment: vector-studio-production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact current main
        id: current_main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            core.setOutput("sha", data.commit.sha);

      - name: Confirm exact current main and explicit authority
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.current_main.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The deployment commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi
          test "${{ inputs.confirmation }}" = "deploy-evavo-vector-studio"
          test "$CURRENT_MAIN_SHA" = "${{ inputs.commit }}"
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"

      - name: Use the repository Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify lockfile integrity
        run: node scripts/check-lockfile-integrity.mjs

      - name: Verify provisioning, deployment and live-proof self-tests
        run: |
          node scripts/provision-vector-studio-vercel.mjs --self-test
          node scripts/plan-vector-studio-vercel-provisioning.mjs --self-test
          node scripts/deploy-vector-studio-vercel.mjs --self-test
          node scripts/create-vector-live-launch-token.mjs --self-test
          node scripts/verify-live-capability-discovery.mjs --self-test

      - name: Verify provisioned project, production environment and domain without mutation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVAVO_CLIENT_APP_LAUNCH_SECRET: ${{ secrets.EVAVO_CLIENT_APP_LAUNCH_SECRET }}
          EVAVO_VECTOR_PRIVATE_SIGNING_SECRET: ${{ secrets.EVAVO_VECTOR_PRIVATE_SIGNING_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VECTOR_API_TOKEN: ${{ secrets.VECTOR_API_TOKEN }}
          VECTOR_WORKER_API_TOKEN: ${{ secrets.VECTOR_WORKER_API_TOKEN }}
        run: |
          mkdir -p .ci
          node scripts/plan-vector-studio-vercel-provisioning.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-provision-before-deploy.json

      - name: Create exact source proof before deployment
        run: |
          node scripts/create-source-proof.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-source-proof.json

      - name: Create or reuse exact production deployment and prove readiness
        id: deployment
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VECTOR_VERCEL_DEPLOY_CONFIRM: ${{ inputs.confirmation }}
        run: |
          node scripts/deploy-vector-studio-vercel.mjs \
            --mode apply \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-production-deployment.json

      - name: Verify live private-response boundary
        id: private_response
        if: ${{ steps.deployment.outcome == 'success' }}
        continue-on-error: true
        run: |
          node scripts/verify-live-private-response.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-live-private-response.json

      - name: Verify exact source and public production runtime
        id: public_runtime
        if: ${{ steps.deployment.outcome == 'success' && steps.private_response.outcome == 'success' }}
        continue-on-error: true
        env:
          VECTOR_DEPLOYMENT_SOURCE_PROOF: .ci/vector-source-proof.json
        run: |
          node scripts/verify-live-deployment.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-public-deployment-proof.json

      - name: Verify live capability discovery and deployment non-claims
        id: capabilities
        if: ${{ steps.public_runtime.outcome == 'success' }}
        continue-on-error: true
        env:
          VECTOR_DEPLOYMENT_SOURCE_PROOF: .ci/vector-source-proof.json
        run: |
          node scripts/verify-live-capability-discovery.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-live-capability-discovery.json

      - name: Verify one-time owner signed launch and replay rejection
        id: owner_launch
        if: ${{ steps.capabilities.outcome == 'success' }}
        continue-on-error: true
        env:
          EVAVO_CLIENT_APP_LAUNCH_SECRET: ${{ secrets.EVAVO_CLIENT_APP_LAUNCH_SECRET }}
          EVAVO_VECTOR_PRIVATE_SIGNING_SECRET: ${{ secrets.EVAVO_VECTOR_PRIVATE_SIGNING_SECRET }}
          VECTOR_DEPLOYMENT_SOURCE_PROOF: .ci/vector-source-proof.json
        shell: bash
        run: |
          set -euo pipefail
          token_file=.ci/vector-owner-live-launch.token
          trap 'rm -f "$token_file"' EXIT
          node scripts/create-vector-live-launch-token.mjs \
            --profile owner \
            --commit "${{ inputs.commit }}" \
            --token-out "$token_file" \
            --receipt-out .ci/vector-owner-live-launch-token.json
          token="$(tr -d '\r\n' < "$token_file")"
          test -n "$token"
          echo "::add-mask::$token"
          VECTOR_DEPLOYMENT_PROOF_LAUNCH_TOKEN="$token" \
            node scripts/verify-live-deployment.mjs \
              --commit "${{ inputs.commit }}" \
              --require-launch \
              --out .ci/vector-owner-live-launch-proof.json

      - name: Verify one-time client signed launch and replay rejection
        id: client_launch
        if: ${{ steps.owner_launch.outcome == 'success' }}
        continue-on-error: true
        env:
          EVAVO_CLIENT_APP_LAUNCH_SECRET: ${{ secrets.EVAVO_CLIENT_APP_LAUNCH_SECRET }}
          EVAVO_VECTOR_PRIVATE_SIGNING_SECRET: ${{ secrets.EVAVO_VECTOR_PRIVATE_SIGNING_SECRET }}
          VECTOR_DEPLOYMENT_SOURCE_PROOF: .ci/vector-source-proof.json
        shell: bash
        run: |
          set -euo pipefail
          token_file=.ci/vector-client-live-launch.token
          trap 'rm -f "$token_file"' EXIT
          node scripts/create-vector-live-launch-token.mjs \
            --profile client \
            --commit "${{ inputs.commit }}" \
            --token-out "$token_file" \
            --receipt-out .ci/vector-client-live-launch-token.json
          token="$(tr -d '\r\n' < "$token_file")"
          test -n "$token"
          echo "::add-mask::$token"
          VECTOR_DEPLOYMENT_PROOF_LAUNCH_TOKEN="$token" \
            node scripts/verify-live-deployment.mjs \
              --commit "${{ inputs.commit }}" \
              --require-launch \
              --out .ci/vector-client-live-launch-proof.json

      - name: Preserve bounded deployment and live proofs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-vercel-production-exact-${{ inputs.commit }}
          path: |
            .ci/vector-vercel-provision-before-deploy.json
            .ci/vector-source-proof.json
            .ci/vector-vercel-production-deployment.json
            .ci/vector-live-private-response.json
            .ci/vector-public-deployment-proof.json
            .ci/vector-live-capability-discovery.json
            .ci/vector-owner-live-launch-token.json
            .ci/vector-owner-live-launch-proof.json
            .ci/vector-client-live-launch-token.json
            .ci/vector-client-live-launch-proof.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Publish exact production deployment status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PRIVATE_RESPONSE_OUTCOME: ${{ steps.private_response.outcome }}
          PUBLIC_RUNTIME_OUTCOME: ${{ steps.public_runtime.outcome }}
          CAPABILITIES_OUTCOME: ${{ steps.capabilities.outcome }}
          OWNER_LAUNCH_OUTCOME: ${{ steps.owner_launch.outcome }}
          CLIENT_LAUNCH_OUTCOME: ${{ steps.client_launch.outcome }}
        with:
          script: |
            const passed =
              process.env.DEPLOYMENT_OUTCOME === "success" &&
              process.env.PRIVATE_RESPONSE_OUTCOME === "success" &&
              process.env.PUBLIC_RUNTIME_OUTCOME === "success" &&
              process.env.CAPABILITIES_OUTCOME === "success" &&
              process.env.OWNER_LAUNCH_OUTCOME === "success" &&
              process.env.CLIENT_LAUNCH_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ inputs.commit }}",
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-production-exact",
              description: passed
                ? "exact production, live capabilities and owner/client launch proofs passed"
                : "Vector Studio exact production deployment proof is incomplete",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce exact production proof result
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PRIVATE_RESPONSE_OUTCOME: ${{ steps.private_response.outcome }}
          PUBLIC_RUNTIME_OUTCOME: ${{ steps.public_runtime.outcome }}
          CAPABILITIES_OUTCOME: ${{ steps.capabilities.outcome }}
          OWNER_LAUNCH_OUTCOME: ${{ steps.owner_launch.outcome }}
          CLIENT_LAUNCH_OUTCOME: ${{ steps.client_launch.outcome }}
        run: |
          test "$DEPLOYMENT_OUTCOME" = "success"
          test "$PRIVATE_RESPONSE_OUTCOME" = "success"
          test "$PUBLIC_RUNTIME_OUTCOME" = "success"
          test "$CAPABILITIES_OUTCOME" = "success"
          test "$OWNER_LAUNCH_OUTCOME" = "success"
          test "$CLIENT_LAUNCH_OUTCOME" = "success"
