name: Vector Studio exact production deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan without mutation or deploy the exact current main commit
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      commit:
        description: Exact lowercase 40-character current main commit
        required: true
        type: string
      confirmation:
        description: "Apply only: deploy-evavo-vector-studio"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-exact-production-deployment
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ inputs.mode == 'plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Confirm exact current main
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The deployment commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify exact deployer self-test
        run: node scripts/deploy-vector-studio-vercel.mjs --self-test

      - name: Create bounded no-mutation deployment plan
        id: deployment
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .ci
          node scripts/deploy-vector-studio-vercel.mjs \
            --mode plan \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-production-plan.json

      - name: Preserve bounded deployment plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-vercel-production-plan-${{ inputs.commit }}
          path: .ci/vector-vercel-production-plan.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

      - name: Publish deployment plan status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        with:
          script: |
            const passed = process.env.DEPLOYMENT_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ inputs.commit }}",
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-production-plan",
              description: passed
                ? "exact production deployment plan passed without mutation"
                : "Vector Studio exact production deployment plan failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce deployment plan result
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: test "$DEPLOYMENT_OUTCOME" = "success"

  apply:
    if: ${{ inputs.mode == 'apply' }}
    environment: vector-studio-production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Confirm exact current main and explicit authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The deployment commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi
          test "${{ inputs.confirmation }}" = "deploy-evavo-vector-studio"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.commit }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Install pnpm 10.14.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10.14.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify provisioning and deployment self-tests
        run: |
          node scripts/provision-vector-studio-vercel.mjs --self-test
          node scripts/deploy-vector-studio-vercel.mjs --self-test

      - name: Verify provisioned project, production environment and domain without mutation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVAVO_CLIENT_APP_LAUNCH_SECRET: ${{ secrets.EVAVO_CLIENT_APP_LAUNCH_SECRET }}
          EVAVO_VECTOR_PRIVATE_SIGNING_SECRET: ${{ secrets.EVAVO_VECTOR_PRIVATE_SIGNING_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VECTOR_API_TOKEN: ${{ secrets.VECTOR_API_TOKEN }}
          VECTOR_WORKER_API_TOKEN: ${{ secrets.VECTOR_WORKER_API_TOKEN }}
        run: |
          mkdir -p .ci
          node scripts/provision-vector-studio-vercel.mjs \
            --mode plan \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-provision-before-deploy.json

      - name: Create exact source proof before deployment
        run: |
          node scripts/create-source-proof.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-source-proof.json

      - name: Create or reuse exact production deployment and prove readiness
        id: deployment
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VECTOR_VERCEL_DEPLOY_CONFIRM: ${{ inputs.confirmation }}
        run: |
          node scripts/deploy-vector-studio-vercel.mjs \
            --mode apply \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-production-deployment.json

      - name: Verify live private-response boundary
        id: private_response
        if: ${{ steps.deployment.outcome == 'success' }}
        continue-on-error: true
        run: |
          node scripts/verify-live-private-response.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-live-private-response.json

      - name: Verify exact source and public production runtime
        id: public_runtime
        if: ${{ steps.deployment.outcome == 'success' && steps.private_response.outcome == 'success' }}
        continue-on-error: true
        env:
          VECTOR_DEPLOYMENT_SOURCE_PROOF: .ci/vector-source-proof.json
        run: |
          node scripts/verify-live-deployment.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-public-deployment-proof.json

      - name: Preserve bounded deployment and live proofs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vector-vercel-production-exact-${{ inputs.commit }}
          path: |
            .ci/vector-vercel-provision-before-deploy.json
            .ci/vector-source-proof.json
            .ci/vector-vercel-production-deployment.json
            .ci/vector-live-private-response.json
            .ci/vector-public-deployment-proof.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Publish exact production deployment status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PRIVATE_RESPONSE_OUTCOME: ${{ steps.private_response.outcome }}
          PUBLIC_RUNTIME_OUTCOME: ${{ steps.public_runtime.outcome }}
        with:
          script: |
            const passed =
              process.env.DEPLOYMENT_OUTCOME === "success" &&
              process.env.PRIVATE_RESPONSE_OUTCOME === "success" &&
              process.env.PUBLIC_RUNTIME_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ inputs.commit }}",
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-production-exact",
              description: passed
                ? "exact production commit, alias and public runtime proofs passed"
                : "Vector Studio exact production deployment proof is incomplete",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce exact production proof result
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          PRIVATE_RESPONSE_OUTCOME: ${{ steps.private_response.outcome }}
          PUBLIC_RUNTIME_OUTCOME: ${{ steps.public_runtime.outcome }}
        run: |
          test "$DEPLOYMENT_OUTCOME" = "success"
          test "$PRIVATE_RESPONSE_OUTCOME" = "success"
          test "$PUBLIC_RUNTIME_OUTCOME" = "success"
