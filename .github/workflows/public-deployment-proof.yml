name: Vector Studio public deployment proof

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact deployed 40-character main commit
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-public-deployment-proof-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Validate requested commit
        shell: bash
        run: |
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The deployment proof commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi

      - name: Checkout exact deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Use the deployed source Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify proof source contract
        run: node scripts/check-release-proof-contract.mjs

      - name: Create exact source proof
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/create-source-proof.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-source-proof.json

      - name: Verify live private response boundary
        id: private
        if: ${{ steps.source.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-private-response.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-private-response-proof.json

      - name: Verify public deployed runtime
        id: live
        if: ${{ steps.source.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          VECTOR_DEPLOYMENT_SOURCE_PROOF: .ci/vector-source-proof.json
        run: |
          set -euo pipefail
          node scripts/verify-live-deployment.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-public-deployment-proof.json

      - name: Record signed-launch boundary
        if: always()
        shell: bash
        run: |
          echo "This public workflow records source, private-response, health and capability evidence only; signed launch is not performed."

      - name: Upload bounded proofs
        if: ${{ steps.source.outcome == 'success' || steps.private.outcome == 'success' || steps.live.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-public-deployment-proof-${{ inputs.commit }}
          path: |
            .ci/vector-source-proof.json
            .ci/vector-private-response-proof.json
            .ci/vector-public-deployment-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Publish public runtime status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PRIVATE_OUTCOME: ${{ steps.private.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          PROOF_COMMIT: ${{ inputs.commit }}
        with:
          script: |
            const passed =
              process.env.SOURCE_OUTCOME === "success" &&
              process.env.PRIVATE_OUTCOME === "success" &&
              process.env.LIVE_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PROOF_COMMIT,
              state: passed ? "success" : "failure",
              context: "release/vector-public-runtime",
              description: passed
                ? "source, private response and public runtime proof passed"
                : "Vector Studio public deployment proof failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce public proof result
        if: always()
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          PRIVATE_OUTCOME: ${{ steps.private.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          if [ "$SOURCE_OUTCOME" != "success" ] || [ "$PRIVATE_OUTCOME" != "success" ] || [ "$LIVE_OUTCOME" != "success" ]; then
            exit 1
          fi
