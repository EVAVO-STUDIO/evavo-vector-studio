name: One-time pnpm lockfile publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/pnpm-lockfile.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: one-time-vector-pnpm-lockfile
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create two isolated byte-identical workspace lockfiles
        id: generation
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          {
            set -euo pipefail
            test ! -f pnpm-lock.yaml
            candidate_a="$(mktemp -d /tmp/vector-lock-a.XXXXXX)"
            candidate_b="$(mktemp -d /tmp/vector-lock-b.XXXXXX)"
            cleanup() {
              git worktree remove --force "$candidate_a" >/dev/null 2>&1 || true
              git worktree remove --force "$candidate_b" >/dev/null 2>&1 || true
              rm -rf "$candidate_a" "$candidate_b"
            }
            trap cleanup EXIT

            git worktree add --detach "$candidate_a" HEAD
            git worktree add --detach "$candidate_b" HEAD

            (
              cd "$candidate_a"
              pnpm install --lockfile-only --ignore-scripts
              test -s pnpm-lock.yaml
            )
            (
              cd "$candidate_b"
              pnpm install --lockfile-only --ignore-scripts
              test -s pnpm-lock.yaml
            )

            cp "$candidate_a/pnpm-lock.yaml" .ci/pnpm-lock.candidate-a.yaml
            cp "$candidate_b/pnpm-lock.yaml" .ci/pnpm-lock.candidate-b.yaml
            sha256sum .ci/pnpm-lock.candidate-a.yaml .ci/pnpm-lock.candidate-b.yaml
            if ! cmp --silent .ci/pnpm-lock.candidate-a.yaml .ci/pnpm-lock.candidate-b.yaml; then
              diff -u .ci/pnpm-lock.candidate-a.yaml .ci/pnpm-lock.candidate-b.yaml > .ci/pnpm-lock.diff || true
              cat .ci/pnpm-lock.diff
              exit 1
            fi
            cp .ci/pnpm-lock.candidate-a.yaml pnpm-lock.yaml
            test -s pnpm-lock.yaml
          } 2>&1 | tee .ci/lockfile-generation.log

      - name: Verify frozen install and complete repository
        id: verification
        if: ${{ always() && steps.generation.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          {
            set -euo pipefail
            pnpm install --frozen-lockfile
            pnpm check
          } 2>&1 | tee .ci/lockfile-verification.log

      - name: Publish lockfile directly to exact verified main
        id: publication
        if: ${{ always() && steps.generation.outcome == 'success' && steps.verification.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s pnpm-lock.yaml
          cp pnpm-lock.yaml /tmp/pnpm-lock.verified.yaml
          git restore --worktree .
          cp /tmp/pnpm-lock.verified.yaml pnpm-lock.yaml
          git fetch origin main
          verified_head="$(git rev-parse HEAD)"
          current_main="$(git rev-parse origin/main)"
          if [ "$verified_head" != "$current_main" ]; then
            echo "LOCKFILE_VERIFIED_HEAD_MOVED:$verified_head:$current_main" >&2
            exit 75
          fi

          rm -f \
            .github/workflows/one-time-pnpm-lockfile.yml \
            .github/pnpm-lockfile.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add pnpm-lock.yaml
          git add -u -- \
            .github/workflows/one-time-pnpm-lockfile.yml \
            .github/pnpm-lockfile.trigger
          git diff --cached --check
          git commit -m "build(release): publish deterministic pnpm lockfile"
          git push origin HEAD:main

      - name: Preserve lockfile publisher diagnostics
        if: ${{ always() && (steps.generation.outcome != 'success' || steps.verification.outcome != 'success' || steps.publication.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-pnpm-lockfile-${{ github.sha }}
          path: .ci/*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 3

      - name: Publish lockfile publisher status
        if: always()
        uses: actions/github-script@v7
        env:
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        with:
          script: |
            const outcomes = [
              process.env.GENERATION_OUTCOME,
              process.env.VERIFICATION_OUTCOME,
              process.env.PUBLICATION_OUTCOME,
            ];
            const passed = outcomes.every((value) => value === "success");
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "release/pnpm-lockfile",
              description: passed
                ? "deterministic lockfile published after frozen verification"
                : `generation=${outcomes[0]} verification=${outcomes[1]} publication=${outcomes[2]}`.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce publication result
        if: always()
        shell: bash
        env:
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
        run: |
          if [ "$GENERATION_OUTCOME" != "success" ] || [ "$VERIFICATION_OUTCOME" != "success" ] || [ "$PUBLICATION_OUTCOME" != "success" ]; then
            exit 1
          fi
