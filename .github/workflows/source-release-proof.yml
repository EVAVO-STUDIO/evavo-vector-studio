name: Vector Studio source release proof

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-source-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use the repository Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify proof source contract
        run: node scripts/check-release-proof-contract.mjs

      - name: Create exact source proof
        id: proof
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node scripts/create-source-proof.mjs \
            --commit "${GITHUB_SHA}" \
            --out .ci/vector-source-proof.json

      - name: Upload source proof
        if: ${{ steps.proof.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-source-proof-${{ github.sha }}
          path: .ci/vector-source-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Publish source proof status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        with:
          script: |
            const passed = process.env.PROOF_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "release/vector-source-proof",
              description: passed
                ? "frozen exact source proof created"
                : "Vector Studio source proof failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce proof result
        if: always()
        shell: bash
        env:
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          if [ "$PROOF_OUTCOME" != "success" ]; then
            exit 1
          fi
