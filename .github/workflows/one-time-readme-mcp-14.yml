name: One-time README MCP 1.4 alignment

on:
  push:
    branches: [main]
    paths:
      - ".github/readme-mcp-14.trigger"

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align README MCP contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target = Path("README.md")
          source = target.read_text(encoding="utf-8")
          replacements = [
              (
                  "MCP contract `1.3` exposes thirteen tools, including:",
                  "MCP contract `1.4` exposes fifteen tools, including:",
              ),
              (
                  "vector_package_dotlottie\nvector_inspect_dotlottie\n```",
                  "vector_package_dotlottie\nvector_inspect_dotlottie\nvector_run_batch\nvector_inspect_batch\n```",
              ),
              (
                  "The Lottie MCP and dotLottie MCP operations use canonical allowed roots, new-file-only transactions and receipt-only results. Generated SVG, PNG, Lottie JSON and ZIP bodies remain outside model context.",
                  "The Lottie, dotLottie and durable batch MCP operations use canonical allowed roots, new-file-only transactions and receipt-only results. Generated SVG, PNG, Lottie JSON and ZIP bodies remain outside model context. MCP batches are paginated, cancellation-aware and resumable when invoked again, accept at most 100 manifest items, and are not a hosted background queue.",
              ),
          ]
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"README_MCP_ANCHOR_INVALID:{old[:40]}")
              source = source.replace(old, new, 1)
          target.write_text(source, encoding="utf-8")
          PY
          grep -Fq 'MCP contract `1.4` exposes fifteen tools' README.md
          grep -Fq 'vector_run_batch' README.md
          grep -Fq 'not a hosted background queue' README.md
          git diff --check

      - name: Commit and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-readme-mcp-14.yml \
            .github/readme-mcp-14.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "docs: align README with MCP batch 1.4"
          git pull --rebase origin main
          git push origin HEAD:main
