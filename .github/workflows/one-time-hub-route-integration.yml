name: One-time hub route integration

on:
  push:
    branches: [main]
    paths:
      - ".github/hub-route-integration.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-hub-route-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate workspace-session API authorization and permanent gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_route(path: str, api_import: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              timing = 'import { timingSafeEqual } from "node:crypto";\n'
              if source.count(timing) != 1:
                  raise SystemExit(f"TIMING_IMPORT_INVALID:{path}:{source.count(timing)}")
              source = source.replace(timing, "", 1)
              anchor = 'import { createJobId } from "@evavo/vector-core";\n'
              if source.count(anchor) != 1:
                  raise SystemExit(f"API_IMPORT_ANCHOR_INVALID:{path}:{source.count(anchor)}")
              source = source.replace(anchor, anchor + f'import {{ apiAuthorisationFailure }} from "{api_import}";\n', 1)
              pattern = re.compile(
                  r'\nfunction secureEqual\(expected: string, supplied: string\): boolean \{.*?\n\}\n\nfunction authorisationFailure\(request: Request\): Response \| null \{.*?\n\}\n',
                  re.S,
              )
              source, count = pattern.subn("\n", source, count=1)
              if count != 1:
                  raise SystemExit(f"AUTH_BLOCK_INVALID:{path}:{count}")
              old = "const authFailure = authorisationFailure(request);"
              new = "const authFailure = apiAuthorisationFailure(request, { allowWorkspaceSession: true });"
              if source.count(old) != 1:
                  raise SystemExit(f"AUTH_CALL_INVALID:{path}:{source.count(old)}")
              source = source.replace(old, new, 1)
              source = source.replace(
                  'headers.set("vary", "authorization");',
                  'headers.set("vary", "authorization, cookie, origin");',
              )
              source = source.replace(
                  'authentication: "Bearer VECTOR_API_TOKEN in production"',
                  'authentication: "same-origin Vector workspace session or Bearer VECTOR_API_TOKEN"',
              )
              target.write_text(source, encoding="utf-8")

          patch_route(
              "apps/web/app/api/v1/trace/route.ts",
              "../../../../lib/api-security",
          )
          for route in [
              "apps/web/app/api/v1/motion/svg/route.ts",
              "apps/web/app/api/v1/motion/lottie/route.ts",
              "apps/web/app/api/v1/motion/dotlottie/route.ts",
          ]:
              patch_route(route, "../../../../../lib/api-security")

          release = Path("scripts/check-release-contract.mjs")
          source = release.read_text(encoding="utf-8")
          anchor = '  "packages/job-control/package.json",\n'
          if '  "packages/hub-auth/package.json",\n' not in source:
              if source.count(anchor) != 1:
                  raise SystemExit("RELEASE_PACKAGE_ANCHOR_INVALID")
              source = source.replace(anchor, '  "packages/hub-auth/package.json",\n' + anchor, 1)
          release.write_text(source, encoding="utf-8")

          gate = Path("scripts/check-http-worker-contract.mjs")
          source = gate.read_text(encoding="utf-8")
          if 'remoteExecutionTests: "workers/http-worker/src/remote-execution.test.ts",' not in source:
              anchor = '  cliHttpTests: "workers/http-worker/src/index-http-mode.test.ts",\n'
              if source.count(anchor) != 1:
                  raise SystemExit("REMOTE_TEST_FILE_ANCHOR_INVALID")
              source = source.replace(
                  anchor,
                  anchor + '  remoteExecutionTests: "workers/http-worker/src/remote-execution.test.ts",\n',
                  1,
              )
              anchor = '''requireTokens(files.cliHttpTests, sources.cliHttpTests, [
            "runs an idle cycle in verified worker-api object mode",
            "fails before lease acquisition when object transfer is unavailable",
            "HTTP_WORKER_OBJECT_TRANSFER_UNAVAILABLE",
            "objectTransferAvailable: true",
            "objectTransferAvailable: false",
          ]);
          '''
              addition = anchor + '''requireTokens(files.remoteExecutionTests, sources.remoteExecutionTests, [
            "optimises one SVG using only HTTP control and object transfer",
            "MemoryHostedJobStore",
            "MemoryVectorObjectStore",
            "completeHostedJobIdempotently",
            "decodeVectorObjectTransaction",
            "commitVectorObjectTransactionIdempotently",
            '"--object-store-mode"',
            '"http"',
            "output/mark.optimised.svg",
            "output/mark.evidence.json",
            "doesNotMatch(result.stdout, /<svg",
            "doesNotMatch(result.stdout, new RegExp(TOKEN))",
            'assert.equal(evidence.approval, "human-review-required")',
          ]);
          '''
              if source.count(anchor) != 1:
                  raise SystemExit("REMOTE_TEST_TOKEN_ANCHOR_INVALID")
              source = source.replace(anchor, addition, 1)
          gate.write_text(source, encoding="utf-8")
          PY

          grep -Fq 'apiAuthorisationFailure(request, { allowWorkspaceSession: true })' apps/web/app/api/v1/trace/route.ts
          grep -Fq 'packages/hub-auth/package.json' scripts/check-release-contract.mjs
          grep -Fq 'remoteExecutionTests' scripts/check-http-worker-contract.mjs
          git diff --check

      - name: Commit integration and retire temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-hub-route-integration.yml \
            .github/hub-route-integration.trigger \
            .github/workflows/one-time-remote-execution-gate.yml \
            .github/remote-execution-gate.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat(hub): authorize signed workspace production routes"
          git pull --rebase origin main
          git push origin HEAD:main
