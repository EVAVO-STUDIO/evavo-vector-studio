name: Vector Studio Vercel deployment contract
# Revalidates the complete resulting main commit after governed lockfile publication.

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - "apps/web/vercel.json"
      - "apps/web/lib/deployment-profile.ts"
      - "apps/web/middleware.ts"
      - "apps/web/app/layout.tsx"
      - "apps/web/app/access/page.tsx"
      - "apps/web/app/launch/route.ts"
      - "apps/web/app/api/v1/capabilities/route.ts"
      - "apps/web/app/api/v1/trace/route.ts"
      - "apps/web/app/api/health/route.ts"
      - "apps/web/public/hub/evavo-vector-studio.deployment.json"
      - "scripts/check-vercel-deployment-contract.mjs"
      - "scripts/check-vercel-project-provisioning-contract.mjs"
      - "scripts/check-vercel-deployment-plan-receipt-contract.mjs"
      - "scripts/check-vercel-production-deployment-contract.mjs"
      - "scripts/check-private-response-contract.mjs"
      - "scripts/provision-vector-studio-vercel.mjs"
      - "scripts/deploy-vector-studio-vercel.mjs"
      - "scripts/create-vector-live-launch-token.mjs"
      - "scripts/verify-live-private-response.mjs"
      - "scripts/verify-live-deployment.mjs"
      - "scripts/verify-live-capability-discovery.mjs"
      - "docs/VERCEL-DEPLOYMENT.md"
      - "docs/PRIVATE-APPLICATION-SECURITY.md"
      - ".github/workflows/public-deployment-proof.yml"
      - ".github/workflows/vector-vercel-project-provisioning.yml"
      - ".github/workflows/vector-vercel-production-deployment.yml"
      - ".github/workflows/vercel-deployment-contract.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - "apps/web/vercel.json"
      - "apps/web/lib/deployment-profile.ts"
      - "apps/web/middleware.ts"
      - "apps/web/app/layout.tsx"
      - "apps/web/app/access/page.tsx"
      - "apps/web/app/launch/route.ts"
      - "apps/web/app/api/v1/capabilities/route.ts"
      - "apps/web/app/api/v1/trace/route.ts"
      - "apps/web/app/api/health/route.ts"
      - "apps/web/public/hub/evavo-vector-studio.deployment.json"
      - "scripts/check-vercel-deployment-contract.mjs"
      - "scripts/check-vercel-project-provisioning-contract.mjs"
      - "scripts/check-vercel-deployment-plan-receipt-contract.mjs"
      - "scripts/check-vercel-production-deployment-contract.mjs"
      - "scripts/check-private-response-contract.mjs"
      - "scripts/provision-vector-studio-vercel.mjs"
      - "scripts/deploy-vector-studio-vercel.mjs"
      - "scripts/create-vector-live-launch-token.mjs"
      - "scripts/verify-live-private-response.mjs"
      - "scripts/verify-live-deployment.mjs"
      - "scripts/verify-live-capability-discovery.mjs"
      - "docs/VERCEL-DEPLOYMENT.md"
      - "docs/PRIVATE-APPLICATION-SECURITY.md"
      - ".github/workflows/public-deployment-proof.yml"
      - ".github/workflows/vector-vercel-project-provisioning.yml"
      - ".github/workflows/vector-vercel-production-deployment.yml"
      - ".github/workflows/vercel-deployment-contract.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10.14.0

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify source deployment contract
        run: node scripts/check-vercel-deployment-contract.mjs

      - name: Verify Vercel project provisioning contract
        run: node scripts/check-vercel-project-provisioning-contract.mjs

      - name: Verify exact production deployment contract
        run: node scripts/check-vercel-production-deployment-contract.mjs

      - name: Verify diagnostic deployment-plan receipt contract
        run: node scripts/check-vercel-deployment-plan-receipt-contract.mjs

      - name: Verify Vercel provisioner self-test
        run: node scripts/provision-vector-studio-vercel.mjs --self-test

      - name: Verify exact Vercel deployer self-test
        run: node scripts/deploy-vector-studio-vercel.mjs --self-test

      - name: Verify live launch token self-test
        run: node scripts/create-vector-live-launch-token.mjs --self-test

      - name: Verify live capability discovery self-test
        run: node scripts/verify-live-capability-discovery.mjs --self-test

      - name: Verify private response security
        run: node scripts/check-private-response-contract.mjs

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck private web application
        run: pnpm --filter @evavo/vector-web typecheck

      - name: Build private web application through Turbo
        run: pnpm exec turbo run build --filter=@evavo/vector-web

      - name: Publish deployment proof status
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const passed = "${{ job.status }}" === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-vercel",
              description: passed
                ? "frozen Vector Studio deployment contract passed"
                : "Vector Studio deployment contract failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
