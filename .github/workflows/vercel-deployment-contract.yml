name: Vector Studio Vercel deployment contract

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - "apps/web/vercel.json"
      - "apps/web/lib/deployment-profile.ts"
      - "apps/web/app/api/v1/trace/route.ts"
      - "apps/web/app/api/health/route.ts"
      - "apps/web/public/hub/evavo-vector-studio.deployment.json"
      - "scripts/check-vercel-deployment-contract.mjs"
      - "docs/VERCEL-DEPLOYMENT.md"
      - ".github/workflows/vercel-deployment-contract.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - "apps/web/vercel.json"
      - "apps/web/lib/deployment-profile.ts"
      - "apps/web/app/api/v1/trace/route.ts"
      - "apps/web/app/api/health/route.ts"
      - "apps/web/public/hub/evavo-vector-studio.deployment.json"
      - "scripts/check-vercel-deployment-contract.mjs"
      - "docs/VERCEL-DEPLOYMENT.md"
      - ".github/workflows/vercel-deployment-contract.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source deployment contract
        run: node scripts/check-vercel-deployment-contract.mjs

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck private web application
        run: pnpm --filter @evavo/vector-web typecheck

      - name: Build private web application
        run: pnpm --filter @evavo/vector-web build

      - name: Publish deployment proof status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = "${{ job.status }}" === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-vercel",
              description: passed
                ? "frozen Vector Studio deployment contract passed"
                : "Vector Studio deployment contract failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
