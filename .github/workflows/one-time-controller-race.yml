name: One-time committed-output race patch

on:
  push:
    branches: [main]
    paths:
      - ".github/controller-race.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-controller-race
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve receipt-backed success across late cancellation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          target = Path("packages/job-control/src/controller.ts")
          source = target.read_text(encoding="utf-8")
          pattern = re.compile(
              r"  async succeed\([\s\S]*?\n  async fail\(",
              re.MULTILINE,
          )
          replacement = '''  async succeed(
            jobId: string,
            leaseToken: string,
            completion: HostedJobCompletion = {},
          ): Promise<HostedJobRecord> {
            const outputs = validateHostedJobOutputReceipts(completion.outputs);
            const evidence = completion.evidence ?? {};
            const evidenceJson = canonicalHostedJobJson(evidence);
            if (Buffer.byteLength(evidenceJson, "utf8") > HOSTED_JOB_MAX_PAYLOAD_BYTES) {
              throw new HostedJobError(
                "HOSTED_JOB_REQUEST_INVALID",
                "completion.evidence exceeds the hosted job JSON limit.",
                { status: 422 },
              );
            }
            return this.#mutate(jobId, (current, now) => {
              assertLease(current, leaseToken, now);
              if (current.status === "cancel-requested" && outputs.length === 0) {
                throw new HostedJobError(
                  "HOSTED_JOB_CANCELLATION_REQUESTED",
                  "The hosted job cannot succeed after cancellation was requested unless immutable output receipts already exist.",
                  { status: 409, details: { jobId } },
                );
              }
              if (current.status !== "running" && current.status !== "cancel-requested") {
                throw new HostedJobError(
                  "HOSTED_JOB_TRANSITION_INVALID",
                  "Only a running or cancellation-raced hosted job can succeed.",
                  { status: 409, details: { jobId, status: current.status } },
                );
              }
              const cancellationRaced = current.status === "cancel-requested";
              return nextRecord(current, {
                status: "succeeded",
                lease: null,
                result: Object.freeze({
                  outputs,
                  evidence: Object.freeze({
                    ...evidence,
                    ...(cancellationRaced
                      ? { cancellationRaceResolution: "committed-success-retained" }
                      : {}),
                  }),
                  completedAt: iso(now),
                }),
                failure: null,
                finishedAt: iso(now),
              }, now);
            });
          }

          async fail('''
          updated, count = pattern.subn(lambda _: replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"SUCCEED_BLOCK_REPLACEMENT_INVALID:{count}")
          target.write_text(updated, encoding="utf-8")
          PY
          grep -Fq 'current.status === "cancel-requested" && outputs.length === 0' packages/job-control/src/controller.ts
          grep -Fq 'cancellationRaceResolution: "committed-success-retained"' packages/job-control/src/controller.ts
          git diff --check

      - name: Commit and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-controller-race.yml \
            .github/controller-race.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(job-control): retain receipt-backed success after cancellation race"
          git pull --rebase origin main
          git push origin HEAD:main
