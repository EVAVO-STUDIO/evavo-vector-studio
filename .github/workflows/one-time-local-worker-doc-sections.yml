name: One-time local worker documentation sections

on:
  push:
    branches: [main]
    paths:
      - ".github/local-worker-doc-sections.trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add local worker capability summaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert(path: str, anchor: str, marker: str, section: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              if marker in source:
                  return
              if source.count(anchor) != 1:
                  raise SystemExit(f"ANCHOR_INVALID:{path}:{anchor}")
              target.write_text(source.replace(anchor, section + anchor, 1), encoding="utf-8")

          insert(
              "README.md",
              "## Quick start on Windows PowerShell\n",
              "### Local worker execution",
              '''### Local worker execution

The `evavo-vector-worker` process can execute supported hosted records against persistent local job and immutable object stores.

- immutable object import with SHA-256 receipts;
- idempotent submit, inspect, list and cancel commands;
- `worker:run-once` and polling `worker:run` modes;
- lease heartbeats, retries and cancellation acknowledgement;
- atomic no-overwrite output transactions;
- receipt-only job records and JSON/NDJSON process output;
- committed-output cancellation-race protection;
- `remoteExecutionAvailable: false` and `hostedBackgroundQueue: false`.

The Local worker is available for workstation and self-hosted execution. Distributed remote execution remains unavailable. See [`docs/LOCAL-WORKER.md`](docs/LOCAL-WORKER.md).

''',
          )
          insert(
              "docs/ARCHITECTURE.md",
              "## Evidence and approval\n",
              "### Local worker",
              '''### Local worker

`@evavo/local-worker` combines hosted job records, leases, immutable object storage and the governed worker executor into a real single-process service. It supports one-shot and polling execution, heartbeat renewal, retryable requeue, cancellation acknowledgement and receipt-only completion records.

A late cancellation that arrives after immutable outputs commit is recorded as receipt-backed success with retained cancellation metadata. This avoids orphaned output objects while preserving the race evidence.

Local worker execution is available. Distributed queue delivery, shared remote storage and autoscaled remote workers remain unavailable.

''',
          )
          insert(
              "docs/HOSTED-JOBS.md",
              "## Deployment phase still required\n",
              "## Local worker execution",
              '''## Local worker execution

A local worker process is available through `evavo-vector-worker` and the repository `worker:*` commands. It uses persistent file-backed job records, immutable object storage, leases, heartbeats and the governed worker engine.

```text
Local single-process worker available
Remote distributed execution unavailable
Hosted background queue unavailable
```

The local worker can execute tracing, SVG optimisation, animated SVG, Lottie JSON and dotLottie packaging. It does not make an ephemeral API filesystem durable and does not establish a managed hosted worker release. See [`LOCAL-WORKER.md`](LOCAL-WORKER.md).

''',
          )
          PY
          grep -Fq '### Local worker execution' README.md
          grep -Fq 'worker:run' README.md
          grep -Fq '### Local worker' docs/ARCHITECTURE.md
          grep -Fq '## Local worker execution' docs/HOSTED-JOBS.md
          git diff --check

      - name: Commit and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-local-worker-doc-sections.yml \
            .github/local-worker-doc-sections.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "docs(worker): publish local execution summaries"
          git pull --rebase origin main
          git push origin HEAD:main
