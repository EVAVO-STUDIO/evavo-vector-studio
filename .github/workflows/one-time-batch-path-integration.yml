name: One-time batch path integration

on:
  push:
    branches: [main]
    paths:
      - ".github/batch-path-integration.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-batch-path-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply canonical path integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          runner = Path("packages/job-engine/src/runner.ts")
          source = runner.read_text(encoding="utf-8")
          anchor = 'import { readBatchManifest } from "./manifest.js";\n'
          if source.count(anchor) != 1 or 'canonicalBatchRoot } from "./path-policy.js"' in source:
              raise SystemExit("RUNNER_PATH_IMPORT_INVALID")
          source = source.replace(
              anchor,
              anchor + 'import { canonicalBatchRoot } from "./path-policy.js";\n',
              1,
          )
          old = "const rootPath = path.resolve("
          if source.count(old) != 1:
              raise SystemExit("RUNNER_ROOT_REPLACEMENT_INVALID")
          source = source.replace(old, "const rootPath = await canonicalBatchRoot(", 1)
          runner.write_text(source, encoding="utf-8")

          inspection = Path("packages/job-engine/src/inspection.ts")
          source = inspection.read_text(encoding="utf-8")
          anchor = 'import { BatchEngineError } from "./errors.js";\n'
          if source.count(anchor) != 1 or 'canonicalBatchRoot } from "./path-policy.js"' in source:
              raise SystemExit("INSPECTION_PATH_IMPORT_INVALID")
          source = source.replace(
              anchor,
              anchor + 'import { canonicalBatchRoot } from "./path-policy.js";\n',
              1,
          )
          pattern = re.compile(
              r'  const paths = batchJobPaths\(\n\s*path\.resolve\(options\.rootPath\),\n',
          )
          source, count = pattern.subn(
              '  const rootPath = await canonicalBatchRoot(options.rootPath);\n'
              '  const paths = batchJobPaths(\n'
              '    rootPath,\n',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("INSPECTION_ROOT_REPLACEMENT_INVALID")
          inspection.write_text(source, encoding="utf-8")

          operations = Path("packages/cli/src/batch-operations.ts")
          source = operations.read_text(encoding="utf-8")
          anchor = '  BatchEngineError,\n'
          if source.count(anchor) != 1 or "createBatchPathPolicy," in source:
              raise SystemExit("OPERATIONS_PATH_IMPORT_INVALID")
          source = source.replace(
              anchor,
              anchor + '  createBatchPathPolicy,\n',
              1,
          )
          replacement = '''async function descriptor(
            context: BatchOperationContext,
            inputPaths: readonly string[],
            outputPaths: readonly string[],
          ): Promise<BatchOperationDescriptor> {
            const policy = await createBatchPathPolicy(context.rootPath);
            const canonicalInputPaths = await Promise.all(
              inputPaths.map((value) => policy.resolveInputFile(value)),
            );
            const canonicalOutputPaths = await Promise.all(
              outputPaths.map((value) => policy.resolveOutputPath(value)),
            );
            policy.assertDistinct([
              ...canonicalInputPaths,
              ...canonicalOutputPaths,
            ]);

            const hash = createHash("sha256");
            hash.update(context.item.operation, "utf8");
            hash.update("\\0", "utf8");
            hash.update(JSON.stringify(stableValue(context.item.spec)), "utf8");
            let totalInputBytes = 0;
            for (const inputPath of canonicalInputPaths) {
              const bytes = await readFile(inputPath);
              totalInputBytes += bytes.byteLength;
              hash.update("\\0", "utf8");
              hash.update(path.relative(policy.root, inputPath), "utf8");
              hash.update("\\0", "utf8");
              hash.update(bytes);
            }
            return Object.freeze({
              revision: hash.digest("hex"),
              inputPaths: Object.freeze(canonicalInputPaths),
              outputPaths: Object.freeze(canonicalOutputPaths),
              summary: Object.freeze({
                totalInputBytes,
                canonicalRoot: policy.root,
              }),
            });
          }'''
          pattern = re.compile(
              r'async function descriptor\([\s\S]*?\n\}\n\nfunction jsonEvidence',
          )
          source, count = pattern.subn(
              lambda _: replacement + '\n\nfunction jsonEvidence',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("OPERATIONS_DESCRIPTOR_REPLACEMENT_INVALID")
          operations.write_text(source, encoding="utf-8")
          PY
          grep -Fq 'import { canonicalBatchRoot } from "./path-policy.js";' packages/job-engine/src/runner.ts
          grep -Fq 'const rootPath = await canonicalBatchRoot(' packages/job-engine/src/runner.ts
          grep -Fq 'const policy = await createBatchPathPolicy(context.rootPath);' packages/cli/src/batch-operations.ts
          grep -Fq 'outputPaths.map((value) => policy.resolveOutputPath(value))' packages/cli/src/batch-operations.ts
          git diff --check

      - name: Commit integration and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-batch-path-integration.yml \
            .github/batch-path-integration.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(jobs): enforce canonical batch paths"
          git pull --rebase origin main
          git push origin HEAD:main
