name: Vector Studio quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: vector-studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release contract
        id: release_contract
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-release-contract.mjs 2>&1 | tee release-contract.log

      - name: Preserve release contract diagnostics
        if: ${{ failure() && steps.release_contract.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-release-contract-${{ github.sha }}
          path: release-contract.log
          if-no-files-found: error
          retention-days: 3

      - name: Verify topology contract
        if: ${{ !cancelled() }}
        run: node scripts/check-topology-contract.mjs

      - name: Verify browser evidence contract
        if: ${{ !cancelled() }}
        run: node scripts/check-browser-evidence-contract.mjs

      - name: Verify MCP contract
        if: ${{ !cancelled() }}
        run: node scripts/check-mcp-contract.mjs

      - name: Verify motion contract
        if: ${{ !cancelled() }}
        run: node scripts/check-motion-contract.mjs

      - name: Verify motion API contract
        if: ${{ !cancelled() }}
        run: node scripts/check-motion-api-contract.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run lint
        id: lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm lint 2>&1 | tee .ci/lint.log

      - name: Run typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm typecheck 2>&1 | tee .ci/typecheck.log

      - name: Run tests
        id: tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm test 2>&1 | tee .ci/test.log

      - name: Run production build
        id: build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm build 2>&1 | tee .ci/build.log

      - name: Preserve governed quality diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-governed-quality-${{ github.sha }}
          path: .ci/*.log
          if-no-files-found: warn
          retention-days: 3
