name: Vector Studio quality

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm 10.14.0
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb # v6.0.0
        with:
          version: 10.14.0
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile bytes and YAML stream boundary
        id: lockfile
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          node scripts/check-lockfile-integrity.mjs 2>&1 | tee .ci/lockfile.log

      - name: Install exact dependencies
        id: install
        if: ${{ !cancelled() && steps.lockfile.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci/install.log

      - name: Run governed source contracts
        id: contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          checks=(
            scripts/check-release-contract.mjs
            scripts/check-release-proof-contract.mjs
            scripts/check-capability-discovery.mjs
            scripts/check-print-preflight-api-contract.mjs
            scripts/check-hub-integration-contract.mjs
            scripts/check-private-response-contract.mjs
            scripts/check-vercel-deployment-contract.mjs
            scripts/check-vercel-project-provisioning-contract.mjs
            scripts/check-vercel-provisioning-plan-receipt-contract.mjs
            scripts/check-vercel-deployment-plan-receipt-contract.mjs
            scripts/check-vercel-production-deployment-contract.mjs
            scripts/check-topology-contract.mjs
            scripts/check-browser-evidence-contract.mjs
            scripts/check-mcp-contract.mjs
            scripts/check-motion-contract.mjs
            scripts/check-motion-api-contract.mjs
            scripts/check-motion-workspace-contract.mjs
            scripts/check-native-runtime-boundary.mjs
            scripts/check-lottie-contract.mjs
            scripts/check-lottie-api-contract.mjs
            scripts/check-lottie-workspace-contract.mjs
            scripts/check-dotlottie-contract.mjs
            scripts/check-dotlottie-api-contract.mjs
            scripts/check-dotlottie-workspace-contract.mjs
            scripts/check-batch-contract.mjs
            scripts/check-hosted-job-contract.mjs
            scripts/check-worker-contract.mjs
            scripts/check-local-worker-contract.mjs
            scripts/check-worker-api-contract.mjs
            scripts/check-worker-client-contract.mjs
            scripts/check-http-worker-contract.mjs
            scripts/check-object-transfer-api-contract.mjs
          )
          : > .ci/contracts.log
          status=0
          set +e
          for check in "${checks[@]}"; do
            printf '\n>>> node %s\n' "$check" | tee -a .ci/contracts.log
            node "$check" 2>&1 | tee -a .ci/contracts.log
            result=${PIPESTATUS[0]}
            if [ "$result" -ne 0 ]; then
              status=1
            fi
          done
          exit "$status"

      - name: Run lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm lint 2>&1 | tee .ci/lint.log

      - name: Run typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm typecheck 2>&1 | tee .ci/typecheck.log

      - name: Run tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm test 2>&1 | tee .ci/test.log

      - name: Run production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm build 2>&1 | tee .ci/build.log

      - name: Publish stable quality statuses
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LOCKFILE_OUTCOME: ${{ steps.lockfile.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const gates = [
              ["lockfile", ".ci/lockfile.log", process.env.LOCKFILE_OUTCOME],
              ["dependencies", ".ci/install.log", process.env.INSTALL_OUTCOME],
              ["contracts", ".ci/contracts.log", process.env.CONTRACTS_OUTCOME],
              ["lint", ".ci/lint.log", process.env.LINT_OUTCOME],
              ["typecheck", ".ci/typecheck.log", process.env.TYPECHECK_OUTCOME],
              ["tests", ".ci/test.log", process.env.TESTS_OUTCOME],
              ["build", ".ci/build.log", process.env.BUILD_OUTCOME],
            ];
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const [name, file, outcome] of gates) {
              const source = fs.existsSync(file)
                ? fs.readFileSync(file, "utf8").replace(/\u001b\[[0-9;]*m/g, "")
                : "";
              const lines = source
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean);
              const diagnostic =
                lines.find((line) =>
                  /error TS\d+|AssertionError|ERR_ASSERTION|Module not found|Type error|Cannot find|is not assignable|does not exist/i.test(line),
                ) ||
                lines.find((line) =>
                  /Error:|ERR_PNPM|ELIFECYCLE|Failed|not ok|failed:|broken lockfile/i.test(line),
                ) ||
                (outcome === "skipped"
                  ? `${name} was skipped because an earlier prerequisite failed`
                  : lines.at(-1)) ||
                `${name} did not produce a diagnostic`;
              const passed = outcome === "success";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: passed ? "success" : "failure",
                context: `vector/${name}`,
                description: passed
                  ? `${name} passed`
                  : diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }

      - name: Preserve governed quality diagnostics
        if: ${{ always() && (steps.lockfile.outcome != 'success' || steps.install.outcome != 'success' || steps.contracts.outcome != 'success' || steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-governed-quality-${{ github.sha }}
          path: .ci/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce quality result
        if: ${{ always() }}
        env:
          LOCKFILE_OUTCOME: ${{ steps.lockfile.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          test "$LOCKFILE_OUTCOME" = "success"
          test "$INSTALL_OUTCOME" = "success"
          test "$CONTRACTS_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$TESTS_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
