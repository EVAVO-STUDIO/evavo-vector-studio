name: Vector Studio quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release contract
        id: release_contract
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-release-contract.mjs 2>&1 | tee release-contract.log

      - name: Preserve release contract diagnostics
        if: ${{ failure() && steps.release_contract.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-release-contract-${{ github.sha }}
          path: release-contract.log
          if-no-files-found: error
          retention-days: 3

      - name: Verify topology contract
        if: ${{ !cancelled() }}
        run: node scripts/check-topology-contract.mjs

      - name: Verify browser evidence contract
        if: ${{ !cancelled() }}
        run: node scripts/check-browser-evidence-contract.mjs

      - name: Verify MCP contract
        if: ${{ !cancelled() }}
        run: node scripts/check-mcp-contract.mjs

      - name: Verify motion contract
        if: ${{ !cancelled() }}
        run: node scripts/check-motion-contract.mjs

      - name: Verify motion API contract
        if: ${{ !cancelled() }}
        run: node scripts/check-motion-api-contract.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run lint
        id: lint
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          pnpm lint > .ci/lint.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -m 8 "error TS[0-9]+|Error:|ERR_PNPM|ELIFECYCLE|Failed|not ok|Module not found|Type error|Cannot find|is not assignable|does not exist" .ci/lint.log || tail -n 40 .ci/lint.log
          fi
          exit "$status"

      - name: Run typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          pnpm typecheck > .ci/typecheck.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -m 8 "error TS[0-9]+|Error:|ERR_PNPM|ELIFECYCLE|Failed|not ok|Module not found|Type error|Cannot find|is not assignable|does not exist" .ci/typecheck.log || tail -n 40 .ci/typecheck.log
          fi
          exit "$status"

      - name: Run tests
        id: tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          pnpm test > .ci/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -m 8 "error TS[0-9]+|Error:|ERR_PNPM|ELIFECYCLE|Failed|not ok|AssertionError|Module not found|Type error|Cannot find|is not assignable|does not exist" .ci/test.log || tail -n 40 .ci/test.log
          fi
          exit "$status"

      - name: Run production build
        id: build
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          pnpm build > .ci/build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E -m 8 "error TS[0-9]+|Error:|ERR_PNPM|ELIFECYCLE|Failed|not ok|Module not found|Type error|Cannot find|is not assignable|does not exist" .ci/build.log || tail -n 40 .ci/build.log
          fi
          exit "$status"

      - name: Publish governed quality diagnostics
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const gates = [
              ["lint", ".ci/lint.log", process.env.LINT_OUTCOME],
              ["typecheck", ".ci/typecheck.log", process.env.TYPECHECK_OUTCOME],
              ["tests", ".ci/test.log", process.env.TEST_OUTCOME],
              ["build", ".ci/build.log", process.env.BUILD_OUTCOME],
            ];
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const [name, file, outcome] of gates) {
              const source = fs.existsSync(file) ? fs.readFileSync(file, "utf8").replace(/\u001b\[[0-9;]*m/g, "") : "";
              const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
              const diagnostic = lines.find((line) => /error TS\d+|Error:|ERR_PNPM|ELIFECYCLE|Failed|not ok|AssertionError|Module not found|Type error|Cannot find|is not assignable|does not exist/i.test(line)) || lines.at(-1) || `${name} did not produce a diagnostic`;
              const state = outcome === "success" ? "success" : "failure";
              const slug = diagnostic
                .normalize("NFKD")
                .replace(/[^A-Za-z0-9._-]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 150) || "unknown-diagnostic";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context: state === "success" ? `vector/${name}` : `vector/${name}/${slug}`,
                description: state === "success" ? `${name} passed` : diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }

      - name: Preserve governed quality diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-governed-quality-${{ github.sha }}
          path: .ci/*.log
          if-no-files-found: warn
          retention-days: 3
