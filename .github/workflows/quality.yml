name: Vector Studio quality

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        id: pnpm
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          corepack enable 2>&1 | tee .ci/pnpm-bootstrap.log
          corepack prepare pnpm@10.14.0 --activate 2>&1 | tee -a .ci/pnpm-bootstrap.log
          version="$(pnpm --version)"
          printf 'pnpm %s\n' "$version" | tee -a .ci/pnpm-bootstrap.log
          test "$version" = "10.14.0"
          git diff --exit-code

      - name: Verify lockfile bytes and YAML stream boundary
        id: lockfile
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          node scripts/check-lockfile-integrity.mjs 2>&1 | tee .ci/lockfile.log

      - name: Install exact dependencies
        id: install
        if: ${{ !cancelled() && steps.pnpm.outcome == 'success' && steps.lockfile.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci/install.log

      - name: Verify runtime version contract
        id: contract_runtime
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-runtime-version.mjs 2>&1 | tee .ci/contracts/contract_runtime.log

      - name: Verify release contract
        id: contract_release
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-release-contract.mjs 2>&1 | tee .ci/contracts/contract_release.log

      - name: Verify release proof contract
        id: contract_release_proof
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-release-proof-contract.mjs 2>&1 | tee .ci/contracts/contract_release_proof.log

      - name: Verify capability discovery contract
        id: contract_capabilities
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-capability-discovery.mjs 2>&1 | tee .ci/contracts/contract_capabilities.log

      - name: Verify print preflight API contract
        id: contract_print_api
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-print-preflight-api-contract.mjs 2>&1 | tee .ci/contracts/contract_print_api.log

      - name: Verify Hub integration contract
        id: contract_hub
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-hub-integration-contract.mjs 2>&1 | tee .ci/contracts/contract_hub.log

      - name: Verify private response contract
        id: contract_private_response
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-private-response-contract.mjs 2>&1 | tee .ci/contracts/contract_private_response.log

      - name: Verify Vercel deployment contract
        id: contract_vercel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-vercel-deployment-contract.mjs 2>&1 | tee .ci/contracts/contract_vercel.log

      - name: Verify Vercel project provisioning contract
        id: contract_vercel_provision
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-vercel-project-provisioning-contract.mjs 2>&1 | tee .ci/contracts/contract_vercel_provision.log

      - name: Verify Vercel provisioning plan receipt contract
        id: contract_vercel_provision_plan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-vercel-provisioning-plan-receipt-contract.mjs 2>&1 | tee .ci/contracts/contract_vercel_provision_plan.log

      - name: Verify Vercel deployment plan receipt contract
        id: contract_vercel_plan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-vercel-deployment-plan-receipt-contract.mjs 2>&1 | tee .ci/contracts/contract_vercel_plan.log

      - name: Verify Vercel production deployment contract
        id: contract_vercel_production
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-vercel-production-deployment-contract.mjs 2>&1 | tee .ci/contracts/contract_vercel_production.log

      - name: Verify topology contract
        id: contract_topology
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-topology-contract.mjs 2>&1 | tee .ci/contracts/contract_topology.log

      - name: Verify browser evidence contract
        id: contract_browser_evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-browser-evidence-contract.mjs 2>&1 | tee .ci/contracts/contract_browser_evidence.log

      - name: Verify MCP contract
        id: contract_mcp
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-mcp-contract.mjs 2>&1 | tee .ci/contracts/contract_mcp.log

      - name: Verify motion contract
        id: contract_motion
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-motion-contract.mjs 2>&1 | tee .ci/contracts/contract_motion.log

      - name: Verify motion API contract
        id: contract_motion_api
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-motion-api-contract.mjs 2>&1 | tee .ci/contracts/contract_motion_api.log

      - name: Verify Motion Director contract
        id: contract_motion_workspace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-motion-workspace-contract.mjs 2>&1 | tee .ci/contracts/contract_motion_workspace.log

      - name: Verify native runtime boundary
        id: contract_native
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-native-runtime-boundary.mjs 2>&1 | tee .ci/contracts/contract_native.log

      - name: Verify Lottie core contract
        id: contract_lottie
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-lottie-contract.mjs 2>&1 | tee .ci/contracts/contract_lottie.log

      - name: Verify Lottie API contract
        id: contract_lottie_api
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-lottie-api-contract.mjs 2>&1 | tee .ci/contracts/contract_lottie_api.log

      - name: Verify browser Lottie contract
        id: contract_lottie_workspace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-lottie-workspace-contract.mjs 2>&1 | tee .ci/contracts/contract_lottie_workspace.log

      - name: Verify dotLottie archive contract
        id: contract_dotlottie
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-dotlottie-contract.mjs 2>&1 | tee .ci/contracts/contract_dotlottie.log

      - name: Verify dotLottie API contract
        id: contract_dotlottie_api
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-dotlottie-api-contract.mjs 2>&1 | tee .ci/contracts/contract_dotlottie_api.log

      - name: Verify browser dotLottie contract
        id: contract_dotlottie_workspace
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-dotlottie-workspace-contract.mjs 2>&1 | tee .ci/contracts/contract_dotlottie_workspace.log

      - name: Verify durable batch contract
        id: contract_batch
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-batch-contract.mjs 2>&1 | tee .ci/contracts/contract_batch.log

      - name: Verify hosted job control contract
        id: contract_hosted_jobs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-hosted-job-contract.mjs 2>&1 | tee .ci/contracts/contract_hosted_jobs.log

      - name: Verify worker execution contract
        id: contract_worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-worker-contract.mjs 2>&1 | tee .ci/contracts/contract_worker.log

      - name: Verify local worker process contract
        id: contract_local_worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-local-worker-contract.mjs 2>&1 | tee .ci/contracts/contract_local_worker.log

      - name: Verify worker control API contract
        id: contract_worker_api
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-worker-api-contract.mjs 2>&1 | tee .ci/contracts/contract_worker_api.log

      - name: Verify worker control client contract
        id: contract_worker_client
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-worker-client-contract.mjs 2>&1 | tee .ci/contracts/contract_worker_client.log

      - name: Verify HTTP-coordinated worker contract
        id: contract_http_worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-http-worker-contract.mjs 2>&1 | tee .ci/contracts/contract_http_worker.log

      - name: Verify worker object-transfer API contract
        id: contract_object_transfer
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci/contracts
          set -o pipefail
          node scripts/check-object-transfer-api-contract.mjs 2>&1 | tee .ci/contracts/contract_object_transfer.log

      - name: Aggregate governed source contracts
        id: contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          CONTRACT_RUNTIME_OUTCOME: ${{ steps.contract_runtime.outcome }}
          CONTRACT_RELEASE_OUTCOME: ${{ steps.contract_release.outcome }}
          CONTRACT_RELEASE_PROOF_OUTCOME: ${{ steps.contract_release_proof.outcome }}
          CONTRACT_CAPABILITIES_OUTCOME: ${{ steps.contract_capabilities.outcome }}
          CONTRACT_PRINT_API_OUTCOME: ${{ steps.contract_print_api.outcome }}
          CONTRACT_HUB_OUTCOME: ${{ steps.contract_hub.outcome }}
          CONTRACT_PRIVATE_RESPONSE_OUTCOME: ${{ steps.contract_private_response.outcome }}
          CONTRACT_VERCEL_OUTCOME: ${{ steps.contract_vercel.outcome }}
          CONTRACT_VERCEL_PROVISION_OUTCOME: ${{ steps.contract_vercel_provision.outcome }}
          CONTRACT_VERCEL_PROVISION_PLAN_OUTCOME: ${{ steps.contract_vercel_provision_plan.outcome }}
          CONTRACT_VERCEL_PLAN_OUTCOME: ${{ steps.contract_vercel_plan.outcome }}
          CONTRACT_VERCEL_PRODUCTION_OUTCOME: ${{ steps.contract_vercel_production.outcome }}
          CONTRACT_TOPOLOGY_OUTCOME: ${{ steps.contract_topology.outcome }}
          CONTRACT_BROWSER_EVIDENCE_OUTCOME: ${{ steps.contract_browser_evidence.outcome }}
          CONTRACT_MCP_OUTCOME: ${{ steps.contract_mcp.outcome }}
          CONTRACT_MOTION_OUTCOME: ${{ steps.contract_motion.outcome }}
          CONTRACT_MOTION_API_OUTCOME: ${{ steps.contract_motion_api.outcome }}
          CONTRACT_MOTION_WORKSPACE_OUTCOME: ${{ steps.contract_motion_workspace.outcome }}
          CONTRACT_NATIVE_OUTCOME: ${{ steps.contract_native.outcome }}
          CONTRACT_LOTTIE_OUTCOME: ${{ steps.contract_lottie.outcome }}
          CONTRACT_LOTTIE_API_OUTCOME: ${{ steps.contract_lottie_api.outcome }}
          CONTRACT_LOTTIE_WORKSPACE_OUTCOME: ${{ steps.contract_lottie_workspace.outcome }}
          CONTRACT_DOTLOTTIE_OUTCOME: ${{ steps.contract_dotlottie.outcome }}
          CONTRACT_DOTLOTTIE_API_OUTCOME: ${{ steps.contract_dotlottie_api.outcome }}
          CONTRACT_DOTLOTTIE_WORKSPACE_OUTCOME: ${{ steps.contract_dotlottie_workspace.outcome }}
          CONTRACT_BATCH_OUTCOME: ${{ steps.contract_batch.outcome }}
          CONTRACT_HOSTED_JOBS_OUTCOME: ${{ steps.contract_hosted_jobs.outcome }}
          CONTRACT_WORKER_OUTCOME: ${{ steps.contract_worker.outcome }}
          CONTRACT_LOCAL_WORKER_OUTCOME: ${{ steps.contract_local_worker.outcome }}
          CONTRACT_WORKER_API_OUTCOME: ${{ steps.contract_worker_api.outcome }}
          CONTRACT_WORKER_CLIENT_OUTCOME: ${{ steps.contract_worker_client.outcome }}
          CONTRACT_HTTP_WORKER_OUTCOME: ${{ steps.contract_http_worker.outcome }}
          CONTRACT_OBJECT_TRANSFER_OUTCOME: ${{ steps.contract_object_transfer.outcome }}
        run: |
          mkdir -p .ci
          cat .ci/contracts/*.log > .ci/contracts.log
          outcomes=(
            "$CONTRACT_RUNTIME_OUTCOME"
            "$CONTRACT_RELEASE_OUTCOME"
            "$CONTRACT_RELEASE_PROOF_OUTCOME"
            "$CONTRACT_CAPABILITIES_OUTCOME"
            "$CONTRACT_PRINT_API_OUTCOME"
            "$CONTRACT_HUB_OUTCOME"
            "$CONTRACT_PRIVATE_RESPONSE_OUTCOME"
            "$CONTRACT_VERCEL_OUTCOME"
            "$CONTRACT_VERCEL_PROVISION_OUTCOME"
            "$CONTRACT_VERCEL_PROVISION_PLAN_OUTCOME"
            "$CONTRACT_VERCEL_PLAN_OUTCOME"
            "$CONTRACT_VERCEL_PRODUCTION_OUTCOME"
            "$CONTRACT_TOPOLOGY_OUTCOME"
            "$CONTRACT_BROWSER_EVIDENCE_OUTCOME"
            "$CONTRACT_MCP_OUTCOME"
            "$CONTRACT_MOTION_OUTCOME"
            "$CONTRACT_MOTION_API_OUTCOME"
            "$CONTRACT_MOTION_WORKSPACE_OUTCOME"
            "$CONTRACT_NATIVE_OUTCOME"
            "$CONTRACT_LOTTIE_OUTCOME"
            "$CONTRACT_LOTTIE_API_OUTCOME"
            "$CONTRACT_LOTTIE_WORKSPACE_OUTCOME"
            "$CONTRACT_DOTLOTTIE_OUTCOME"
            "$CONTRACT_DOTLOTTIE_API_OUTCOME"
            "$CONTRACT_DOTLOTTIE_WORKSPACE_OUTCOME"
            "$CONTRACT_BATCH_OUTCOME"
            "$CONTRACT_HOSTED_JOBS_OUTCOME"
            "$CONTRACT_WORKER_OUTCOME"
            "$CONTRACT_LOCAL_WORKER_OUTCOME"
            "$CONTRACT_WORKER_API_OUTCOME"
            "$CONTRACT_WORKER_CLIENT_OUTCOME"
            "$CONTRACT_HTTP_WORKER_OUTCOME"
            "$CONTRACT_OBJECT_TRANSFER_OUTCOME"
          )
          status=0
          for outcome in "${outcomes[@]}"; do
            if [ "$outcome" != "success" ]; then
              status=1
            fi
          done
          exit "$status"

      - name: Run lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm lint 2>&1 | tee .ci/lint.log

      - name: Run typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm typecheck 2>&1 | tee .ci/typecheck.log

      - name: Run tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm test 2>&1 | tee .ci/test.log

      - name: Run production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .ci
          set -o pipefail
          pnpm build 2>&1 | tee .ci/build.log

      - name: Publish stable quality statuses
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          LOCKFILE_OUTCOME: ${{ steps.lockfile.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const gates = [
              ["toolchain", ".ci/pnpm-bootstrap.log", process.env.PNPM_OUTCOME],
              ["lockfile", ".ci/lockfile.log", process.env.LOCKFILE_OUTCOME],
              ["dependencies", ".ci/install.log", process.env.INSTALL_OUTCOME],
              ["contracts", ".ci/contracts.log", process.env.CONTRACTS_OUTCOME],
              ["lint", ".ci/lint.log", process.env.LINT_OUTCOME],
              ["typecheck", ".ci/typecheck.log", process.env.TYPECHECK_OUTCOME],
              ["tests", ".ci/test.log", process.env.TESTS_OUTCOME],
              ["build", ".ci/build.log", process.env.BUILD_OUTCOME],
            ];
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const [name, file, outcome] of gates) {
              const source = fs.existsSync(file)
                ? fs.readFileSync(file, "utf8").replace(/\u001b\[[0-9;]*m/g, "")
                : "";
              const lines = source
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean);
              const diagnostic =
                lines.find((line) =>
                  /error TS\d+|AssertionError|ERR_ASSERTION|Module not found|Type error|Cannot find|is not assignable|does not exist/i.test(line),
                ) ||
                lines.find((line) =>
                  /Error:|ERR_PNPM|ELIFECYCLE|Failed|not ok|failed:|broken lockfile/i.test(line),
                ) ||
                (outcome === "skipped"
                  ? `${name} was skipped because an earlier prerequisite failed`
                  : lines.at(-1)) ||
                `${name} did not produce a diagnostic`;
              const passed = outcome === "success";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: passed ? "success" : "failure",
                context: `vector/${name}`,
                description: passed
                  ? `${name} passed`
                  : diagnostic.slice(0, 140),
                target_url: targetUrl,
              });
            }

      - name: Preserve governed quality diagnostics
        if: ${{ always() && (steps.pnpm.outcome != 'success' || steps.lockfile.outcome != 'success' || steps.install.outcome != 'success' || steps.contracts.outcome != 'success' || steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-governed-quality-${{ github.sha }}
          path: .ci/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce quality result
        if: ${{ always() }}
        env:
          PNPM_OUTCOME: ${{ steps.pnpm.outcome }}
          LOCKFILE_OUTCOME: ${{ steps.lockfile.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          test "$PNPM_OUTCOME" = "success"
          test "$LOCKFILE_OUTCOME" = "success"
          test "$INSTALL_OUTCOME" = "success"
          test "$CONTRACTS_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$TESTS_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
