name: Vector Studio Vercel project provisioning

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan, reconcile provider-only settings, or apply the full production transaction
        required: true
        default: plan
        type: choice
        options:
          - plan
          - settings
          - apply
      commit:
        description: Exact lowercase 40-character current main commit
        required: true
        type: string
      confirmation:
        description: "Settings: reconcile-evavo-vector-studio-project-settings; full apply: provision-evavo-vector-studio"
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-studio-vercel-project-provisioning
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ inputs.mode == 'plan' }}
    environment: vector-studio-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact current main
        id: current_main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            core.setOutput("sha", data.commit.sha);

      - name: Confirm exact current main
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.current_main.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The provisioning commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi
          test "$CURRENT_MAIN_SHA" = "${{ inputs.commit }}"
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"

      - name: Use the repository Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify lockfile integrity
        run: node scripts/check-lockfile-integrity.mjs

      - name: Verify provisioner, wrapper and provider-receipt self-tests
        run: |
          node scripts/provision-vector-studio-vercel.mjs --self-test
          node scripts/plan-vector-studio-vercel-provisioning.mjs --self-test
          node scripts/enforce-vercel-provider-inspection-receipt.mjs --self-test

      - name: Create bounded no-mutation plan
        id: provision
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node scripts/plan-vector-studio-vercel-provisioning.mjs \
            --commit "${{ inputs.commit }}" \
            --out .ci/vector-vercel-provision-plan.json

      - name: Enforce exact provider inspection receipt
        id: provider_inspection
        if: always()
        continue-on-error: true
        run: |
          node scripts/enforce-vercel-provider-inspection-receipt.mjs \
            --receipt .ci/vector-vercel-provision-plan.json \
            --commit "${{ inputs.commit }}"

      - name: Preserve bounded plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-vercel-provision-plan-${{ inputs.commit }}
          path: .ci/vector-vercel-provision-plan.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Publish plan status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INSPECTION_OUTCOME: ${{ steps.provider_inspection.outcome }}
        with:
          script: |
            const passed = process.env.INSPECTION_OUTCOME === "success";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ inputs.commit }}",
              state: passed ? "success" : "failure",
              context: "deploy/vector-studio-vercel-provision-plan",
              description: passed
                ? "exact read-only Vercel provider inspection passed"
                : "Vector Studio Vercel provider inspection failed",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce plan result
        if: always()
        env:
          INSPECTION_OUTCOME: ${{ steps.provider_inspection.outcome }}
        run: test "$INSPECTION_OUTCOME" = "success"

  mutate:
    if: ${{ inputs.mode != 'plan' }}
    environment: vector-studio-production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact current main
        id: current_main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            core.setOutput("sha", data.commit.sha);

      - name: Confirm exact current main and scoped authority
        shell: bash
        env:
          CURRENT_MAIN_SHA: ${{ steps.current_main.outputs.sha }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SUPPLIED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.commit }}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "The provisioning commit must be a lowercase 40-character SHA." >&2
            exit 1
          fi
          case "$REQUESTED_MODE" in
            settings)
              expected_confirmation="reconcile-evavo-vector-studio-project-settings"
              ;;
            apply)
              expected_confirmation="provision-evavo-vector-studio"
              ;;
            *)
              echo "Unsupported mutating provisioning mode: $REQUESTED_MODE" >&2
              exit 1
              ;;
          esac
          test "$SUPPLIED_CONFIRMATION" = "$expected_confirmation"
          test "$CURRENT_MAIN_SHA" = "${{ inputs.commit }}"
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"

      - name: Use the repository Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify lockfile integrity
        run: node scripts/check-lockfile-integrity.mjs

      - name: Verify provisioner, wrapper and provider-receipt self-tests
        run: |
          node scripts/provision-vector-studio-vercel.mjs --self-test
          node scripts/plan-vector-studio-vercel-provisioning.mjs --self-test
          node scripts/enforce-vercel-provider-inspection-receipt.mjs --self-test

      - name: Create exact source proof before mutation
        run: node scripts/create-source-proof.mjs --commit "${{ inputs.commit }}" --out .ci/vector-source-proof.json

      - name: Reconcile provider-only Vercel project settings
        id: settings
        if: ${{ inputs.mode == 'settings' }}
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VECTOR_VERCEL_OPERATION_CONFIRM: ${{ inputs.confirmation }}
        run: node scripts/provision-vector-studio-vercel.mjs --mode settings --commit "${{ inputs.commit }}" --out .ci/vector-vercel-provision-settings.json

      - name: Apply full Vercel production configuration
        id: full_apply
        if: ${{ inputs.mode == 'apply' }}
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVAVO_CLIENT_APP_LAUNCH_SECRET: ${{ secrets.EVAVO_CLIENT_APP_LAUNCH_SECRET }}
          EVAVO_VECTOR_PRIVATE_SIGNING_SECRET: ${{ secrets.EVAVO_VECTOR_PRIVATE_SIGNING_SECRET }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          VECTOR_API_TOKEN: ${{ secrets.VECTOR_API_TOKEN }}
          VECTOR_WORKER_API_TOKEN: ${{ secrets.VECTOR_WORKER_API_TOKEN }}
          VECTOR_VERCEL_OPERATION_CONFIRM: ${{ inputs.confirmation }}
        run: node scripts/provision-vector-studio-vercel.mjs --mode apply --commit "${{ inputs.commit }}" --out .ci/vector-vercel-provision-apply.json

      - name: Preserve bounded source and provisioning receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vector-vercel-provision-${{ inputs.mode }}-${{ inputs.commit }}
          path: |
            .ci/vector-source-proof.json
            .ci/vector-vercel-provision-${{ inputs.mode }}.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Publish scoped mutation status
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SETTINGS_OUTCOME: ${{ steps.settings.outcome }}
          APPLY_OUTCOME: ${{ steps.full_apply.outcome }}
        with:
          script: |
            const mode = process.env.REQUESTED_MODE;
            const outcome = mode === "settings"
              ? process.env.SETTINGS_OUTCOME
              : process.env.APPLY_OUTCOME;
            const passed = outcome === "success";
            const status = mode === "settings"
              ? {
                  context: "deploy/vector-studio-vercel-project-settings",
                  passed: "Vercel project settings match the governed source contract",
                  failed: "Vector Studio Vercel project settings remain unreconciled",
                }
              : {
                  context: "deploy/vector-studio-vercel-provision-apply",
                  passed: "Vercel project, production environment and domain are verified",
                  failed: "Vector Studio full Vercel production configuration is incomplete",
                };
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ inputs.commit }}",
              state: passed ? "success" : "failure",
              context: status.context,
              description: passed ? status.passed : status.failed,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Enforce scoped mutation result
        if: always()
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          SETTINGS_OUTCOME: ${{ steps.settings.outcome }}
          APPLY_OUTCOME: ${{ steps.full_apply.outcome }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MODE" in
            settings) test "$SETTINGS_OUTCOME" = "success" ;;
            apply) test "$APPLY_OUTCOME" = "success" ;;
            *) exit 1 ;;
          esac
