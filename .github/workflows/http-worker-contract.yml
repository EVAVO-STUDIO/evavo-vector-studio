name: HTTP Worker contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vector-http-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify HTTP-coordinated worker contract
        run: node scripts/check-http-worker-contract.mjs

      - name: Verify no tracked source mutation
        run: git diff --exit-code
