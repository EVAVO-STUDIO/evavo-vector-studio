name: One-time object-store boundary patch

on:
  push:
    branches: [main]
    paths:
      - ".github/object-store-boundary.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-object-store-boundary
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Isolate object stores from native worker mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for relative in [
              "packages/worker-engine/src/file-object-store.ts",
              "packages/worker-engine/src/memory-object-store.ts",
          ]:
              target = Path(relative)
              source = target.read_text(encoding="utf-8")
              old = 'from "./errors.js";'
              new = 'from "./base-errors.js";'
              if source.count(old) != 1:
                  raise SystemExit(f"OBJECT_STORE_IMPORT_ANCHOR_INVALID:{relative}:{source.count(old)}")
              target.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          grep -Fq 'from "./base-errors.js";' packages/worker-engine/src/file-object-store.ts
          grep -Fq 'from "./base-errors.js";' packages/worker-engine/src/memory-object-store.ts
          if grep -Fq 'from "./errors.js";' packages/worker-engine/src/file-object-store.ts; then exit 1; fi
          if grep -Fq 'from "./errors.js";' packages/worker-engine/src/memory-object-store.ts; then exit 1; fi
          git diff --check

      - name: Commit boundary and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-object-store-boundary.yml \
            .github/object-store-boundary.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "refactor(worker): isolate object-store imports"
          git pull --rebase origin main
          git push origin HEAD:main
