name: Vector Studio capability discovery

on:
  push:
    branches: [main]
    paths:
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/web/app/api/v1/capabilities/**"
      - "apps/web/package.json"
      - "packages/raster-engine/**"
      - "packages/motion-engine/**"
      - "packages/lottie-engine/**"
      - "packages/job-engine/**"
      - "packages/mcp/**"
      - "packages/worker-engine/**"
      - "scripts/check-runtime-version.mjs"
      - "scripts/check-capability-discovery.mjs"
      - "docs/CAPABILITIES.md"
      - ".github/workflows/capabilities-api-contract.yml"
  pull_request:
    paths:
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/web/app/api/v1/capabilities/**"
      - "apps/web/package.json"
      - "packages/raster-engine/**"
      - "packages/motion-engine/**"
      - "packages/lottie-engine/**"
      - "packages/job-engine/**"
      - "packages/mcp/**"
      - "packages/worker-engine/**"
      - "scripts/check-runtime-version.mjs"
      - "scripts/check-capability-discovery.mjs"
      - "docs/CAPABILITIES.md"
      - ".github/workflows/capabilities-api-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: vector-capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Use the repository Node.js version without package-manager caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Activate exact pnpm through Corepack
        id: toolchain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          test "$(pnpm --version)" = "10.14.0"
          git diff --exit-code

      - name: Verify capability discovery contract
        id: contract
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/check-capability-discovery.mjs

      - name: Install exact dependencies
        id: install
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Build Vector workspace dependencies
        id: dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: pnpm build:packages

      - name: Typecheck Vector web
        id: typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: pnpm --filter @evavo/vector-web typecheck

      - name: Build Vector web
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        continue-on-error: true
        run: pnpm --filter @evavo/vector-web build

      - name: Publish capability discovery statuses
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const toolchainPassed = process.env.TOOLCHAIN_OUTCOME === "success";
            const dependenciesPassed =
              toolchainPassed &&
              process.env.INSTALL_OUTCOME === "success" &&
              process.env.DEPENDENCIES_OUTCOME === "success";
            const gates = [
              ["api/vector-capabilities-toolchain", toolchainPassed, "exact runtime and pnpm toolchain"],
              ["api/vector-capabilities-contract", toolchainPassed && process.env.CONTRACT_OUTCOME === "success", "capability contract"],
              ["api/vector-capabilities-dependencies", dependenciesPassed, "workspace dependency build"],
              ["api/vector-capabilities-typecheck", dependenciesPassed && process.env.TYPECHECK_OUTCOME === "success", "Vector web typecheck"],
              ["api/vector-capabilities-build", dependenciesPassed && process.env.BUILD_OUTCOME === "success", "Vector web build"],
            ];
            for (const [name, passed, label] of gates) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: passed ? "success" : "failure",
                context: name,
                description: passed ? `${label} passed` : `${label} failed`,
                target_url: targetUrl,
              });
            }

      - name: Enforce capability discovery result
        if: always()
        shell: bash
        env:
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          test "$TOOLCHAIN_OUTCOME" = "success"
          test "$CONTRACT_OUTCOME" = "success"
          test "$INSTALL_OUTCOME" = "success"
          test "$DEPENDENCIES_OUTCOME" = "success"
          test "$TYPECHECK_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
