name: One-time private response security integration

on:
  push:
    branches: [main]
    paths:
      - ".github/private-response-integration.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: one-time-vector-private-response-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate private response contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          layout = Path("apps/web/app/layout.tsx")
          source = layout.read_text(encoding="utf-8")
          if 'import type { Metadata } from "next";' not in source:
              source = 'import type { Metadata } from "next";\n' + source
          old_metadata = '''export const metadata = {
            title: "EVAVO Vector Studio",
            description: "Professional raster-to-vector, SVG motion and Lottie production workspace."
          };
          '''
          new_metadata = '''export const metadata: Metadata = {
            title: "EVAVO Vector Studio",
            description: "Professional raster-to-vector, SVG motion and Lottie production workspace.",
            robots: { index: false, follow: false, archive: false },
            referrer: "no-referrer",
          };
          '''
          if 'robots: { index: false, follow: false' not in source:
              if source.count(old_metadata) != 1:
                  raise SystemExit(f"PRIVATE_METADATA_ANCHOR_INVALID:{source.count(old_metadata)}")
              source = source.replace(old_metadata, new_metadata, 1)
          layout.write_text(source, encoding="utf-8")

          contract = Path("scripts/check-private-response-contract.mjs")
          source = contract.read_text(encoding="utf-8")
          source = source.replace(
              'requireTokens(files.access, sources.access, ["Return to EVAVO hub", "noindex"]);',
              'requireTokens(files.access, sources.access, ["Return to EVAVO hub"]);',
          )
          contract.write_text(source, encoding="utf-8")

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.setdefault("scripts", {})
          scripts["private-response:check"] = "node scripts/check-private-response-contract.mjs"
          check = scripts.get("check", "")
          anchor = "pnpm hub:check &&"
          if "pnpm private-response:check" not in check:
              if check.count(anchor) != 1:
                  raise SystemExit(f"PRIVATE_RESPONSE_PACKAGE_ANCHOR_INVALID:{check.count(anchor)}")
              check = check.replace(anchor, anchor + " pnpm private-response:check &&", 1)
          scripts["check"] = check
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          workflow = Path(".github/workflows/vercel-deployment-contract.yml")
          source = workflow.read_text(encoding="utf-8")
          anchor = '      - "apps/web/lib/deployment-profile.ts"\n'
          for token in [
              '      - "apps/web/middleware.ts"\n',
              '      - "apps/web/app/layout.tsx"\n',
              '      - "scripts/check-private-response-contract.mjs"\n',
              '      - "docs/PRIVATE-APPLICATION-SECURITY.md"\n',
          ]:
              if token not in source:
                  if source.count(anchor) != 2:
                      raise SystemExit(f"PRIVATE_RESPONSE_WORKFLOW_PATH_ANCHOR_INVALID:{source.count(anchor)}")
                  source = source.replace(anchor, anchor + token)
          step_anchor = "      - name: Install frozen workspace\n"
          if "node scripts/check-private-response-contract.mjs" not in source:
              if source.count(step_anchor) != 1:
                  raise SystemExit(f"PRIVATE_RESPONSE_WORKFLOW_STEP_ANCHOR_INVALID:{source.count(step_anchor)}")
              source = source.replace(
                  step_anchor,
                  "      - name: Verify private response security\n        run: node scripts/check-private-response-contract.mjs\n\n" + step_anchor,
                  1,
              )
          workflow.write_text(source, encoding="utf-8")

          quality = Path(".github/workflows/quality.yml")
          source = quality.read_text(encoding="utf-8")
          anchor = "      - name: Verify topology contract\n"
          if "Verify private response security contract" not in source:
              if source.count(anchor) != 1:
                  raise SystemExit(f"PRIVATE_RESPONSE_QUALITY_ANCHOR_INVALID:{source.count(anchor)}")
              source = source.replace(
                  anchor,
                  "      - name: Verify private response security contract\n        if: ${{ !cancelled() }}\n        run: node scripts/check-private-response-contract.mjs\n\n" + anchor,
                  1,
              )
          quality.write_text(source, encoding="utf-8")
          PY

          node scripts/check-private-response-contract.mjs
          node scripts/check-hub-integration-contract.mjs
          git diff --check

      - name: Frozen install and complete verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm check

      - name: Commit integration and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-private-response-integration.yml \
            .github/private-response-integration.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(security): govern private application responses"
          git pull --rebase origin main
          git push origin HEAD:main
