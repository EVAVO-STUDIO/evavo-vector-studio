name: Vector Studio repository capabilities

on:
  push:
    branches: [main]
    paths:
      - 'evavo.capabilities.json'
      - 'schemas/evavo.repository-capabilities.schema.json'
      - 'scripts/check-repository-capability-registry.mjs'
      - 'packages/mcp/**'
      - 'package.json'
      - '.github/workflows/repository-capabilities.yml'
  pull_request:
    branches: [main]
    paths:
      - 'evavo.capabilities.json'
      - 'schemas/evavo.repository-capabilities.schema.json'
      - 'scripts/check-repository-capability-registry.mjs'
      - 'packages/mcp/**'
      - 'package.json'
      - '.github/workflows/repository-capabilities.yml'

permissions:
  contents: read

concurrency:
  group: vector-repository-capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22.16
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Validate repository capability registry
        run: node scripts/check-repository-capability-registry.mjs
