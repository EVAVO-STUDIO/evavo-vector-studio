name: One-time hosted capability discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/hosted-ui-capabilities.trigger"

permissions:
  contents: write
  statuses: write

concurrency:
  group: one-time-vector-hosted-ui-capabilities
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover hosted trace capabilities in the browser
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path("apps/web/app/components/TraceWorkspace.tsx")
          source = target.read_text(encoding="utf-8")

          type_anchor = 'type CandidateMode = "adaptive" | "single";\n'
          type_block = '''type CandidateMode = "adaptive" | "single";
          type HostingProfile = "local" | "vercel";
          type TraceCapabilities = Readonly<{
            limits?: Readonly<{
              maxInputBytes?: number;
              maxInteractiveInputBytes?: number;
              maxInteractiveRequestBytes?: number;
              maxInteractiveResponseBytes?: number;
            }>;
            hosting?: Readonly<{
              hostingProfile?: HostingProfile;
              provider?: string;
              providerDirectPrivateStorageConfigured?: boolean;
            }>;
            largeObjectTransport?: string;
          }>;
          '''
          if "type TraceCapabilities" not in source:
              if source.count(type_anchor) != 1:
                  raise SystemExit(f"TRACE_CAPABILITY_TYPE_ANCHOR_INVALID:{source.count(type_anchor)}")
              source = source.replace(type_anchor, type_block, 1)

          state_anchor = '  const [file, setFile] = useState<File | null>(null);\n'
          state_block = '''  const [file, setFile] = useState<File | null>(null);
            const [effectiveMaxInputBytes, setEffectiveMaxInputBytes] = useState(MAX_INPUT_BYTES);
            const [hostingProfile, setHostingProfile] = useState<HostingProfile>("local");
            const [largeObjectTransport, setLargeObjectTransport] = useState(
              "local CLI, MCP, durable batch or self-hosted worker",
            );
          '''
          if "effectiveMaxInputBytes" not in source:
              if source.count(state_anchor) != 1:
                  raise SystemExit(f"TRACE_CAPABILITY_STATE_ANCHOR_INVALID:{source.count(state_anchor)}")
              source = source.replace(state_anchor, state_block, 1)

          effect_anchor = '''  useEffect(() => {
              if (!file) {
          '''
          capability_effect = '''  useEffect(() => {
            let active = true;
            void fetch("/api/v1/trace", {
              method: "GET",
              credentials: "same-origin",
              cache: "no-store",
              headers: { accept: "application/json" },
            })
              .then(async (response) => {
                if (!response.ok) return null;
                return (await response.json()) as TraceCapabilities;
              })
              .then((capabilities) => {
                if (!active || !capabilities) return;
                const effectiveLimit = capabilities.limits?.maxInteractiveInputBytes;
                if (
                  typeof effectiveLimit === "number" &&
                  Number.isSafeInteger(effectiveLimit) &&
                  effectiveLimit > 0 &&
                  effectiveLimit <= MAX_INPUT_BYTES
                ) {
                  setEffectiveMaxInputBytes(effectiveLimit);
                }
                const profile = capabilities.hosting?.hostingProfile;
                if (profile === "local" || profile === "vercel") {
                  setHostingProfile(profile);
                }
                if (capabilities.largeObjectTransport) {
                  setLargeObjectTransport(capabilities.largeObjectTransport);
                }
              })
              .catch(() => {
                // The local engine limit remains the fail-safe when capability discovery is unavailable.
              });
            return () => {
              active = false;
            };
          }, []);

          '''
          if 'fetch("/api/v1/trace", {' not in source:
              if source.count(effect_anchor) != 1:
                  raise SystemExit(f"TRACE_CAPABILITY_EFFECT_ANCHOR_INVALID:{source.count(effect_anchor)}")
              source = source.replace(effect_anchor, capability_effect + effect_anchor, 1)

          source = source.replace(
              "if (candidate.size > MAX_INPUT_BYTES) {",
              "if (candidate.size > effectiveMaxInputBytes) {",
          )
          source = source.replace(
              'setError("The source exceeds the 25 MB guarded input limit.");',
              'setError(`The source exceeds the ${readableBytes(effectiveMaxInputBytes)} ${hostingProfile === "vercel" ? "hosted transfer" : "guarded input"} limit. For larger sources use ${largeObjectTransport}.`);',
          )

          fetch_anchor = '''      const response = await fetch("/api/v1/trace", {
                method: "POST",
          '''
          fetch_replacement = '''      const response = await fetch("/api/v1/trace", {
                method: "POST",
                credentials: "same-origin",
          '''
          if 'method: "POST",\n        credentials: "same-origin",' not in source:
              if source.count(fetch_anchor) != 1:
                  raise SystemExit(f"TRACE_CREDENTIALS_ANCHOR_INVALID:{source.count(fetch_anchor)}")
              source = source.replace(fetch_anchor, fetch_replacement, 1)

          target.write_text(source, encoding="utf-8")

          contract = Path("scripts/check-hosted-ui-contract.mjs")
          contract.write_text('''import fs from "node:fs/promises";
          import path from "node:path";

          const root = process.cwd();
          const errors = [];
          const checkedFiles = new Set();
          async function read(file) {
            checkedFiles.add(file);
            try { return (await fs.readFile(path.join(root, file), "utf8")).replace(/^\\uFEFF/, ""); }
            catch (error) { errors.push(`Missing or unreadable file: ${file} (${error instanceof Error ? error.message : String(error)})`); return ""; }
          }
          function requireTokens(file, source, tokens) {
            for (const token of tokens) if (!source.includes(token)) errors.push(`${file} is missing hosted UI token: ${token}`);
          }
          const files = {
            workspace: "apps/web/app/components/TraceWorkspace.tsx",
            trace: "apps/web/app/api/v1/trace/route.ts",
            profile: "apps/web/lib/deployment-profile.ts",
            workflow: ".github/workflows/vercel-deployment-contract.yml",
          };
          const sources = Object.fromEntries(await Promise.all(Object.entries(files).map(async ([key, file]) => [key, await read(file)])));
          requireTokens(files.workspace, sources.workspace, [
            "type TraceCapabilities",
            "effectiveMaxInputBytes",
            "hostingProfile",
            "largeObjectTransport",
            'fetch("/api/v1/trace", {',
            'method: "GET"',
            'credentials: "same-origin"',
            "capabilities.limits?.maxInteractiveInputBytes",
            "candidate.size > effectiveMaxInputBytes",
            "hosted transfer",
            "For larger sources use",
          ]);
          requireTokens(files.trace, sources.trace, [
            "maxInteractiveInputBytes",
            "hosting: TRACE_PAYLOAD_POLICY",
            "largeObjectTransport",
          ]);
          requireTokens(files.profile, sources.profile, [
            "VERCEL_SAFE_MULTIPART_FILE_BYTES = 3_250_000",
            "providerDirectPrivateStorageConfigured: false",
          ]);
          requireTokens(files.workflow, sources.workflow, [
            "node scripts/check-hosted-ui-contract.mjs",
          ]);
          if (errors.length) {
            process.stderr.write(`${JSON.stringify({ check: "evavo-vector-hosted-ui", ok: false, contractVersion: "1.0", errors }, null, 2)}\\n`);
            process.exit(1);
          }
          process.stdout.write(`${JSON.stringify({ check: "evavo-vector-hosted-ui", ok: true, contractVersion: "1.0", checkedFiles: [...checkedFiles].sort() }, null, 2)}\\n`);
          ''', encoding="utf-8")

          workflow = Path(".github/workflows/vercel-deployment-contract.yml")
          source = workflow.read_text(encoding="utf-8")
          path_anchor = '      - "apps/web/app/api/v1/trace/route.ts"\n'
          for token in [
              '      - "apps/web/app/components/TraceWorkspace.tsx"\n',
              '      - "scripts/check-hosted-ui-contract.mjs"\n',
          ]:
              if token not in source:
                  if source.count(path_anchor) != 2:
                      raise SystemExit(f"HOSTED_UI_WORKFLOW_PATH_ANCHOR_INVALID:{source.count(path_anchor)}")
                  source = source.replace(path_anchor, path_anchor + token)
          step_anchor = "      - name: Install frozen workspace\n"
          if "node scripts/check-hosted-ui-contract.mjs" not in source:
              if source.count(step_anchor) != 1:
                  raise SystemExit(f"HOSTED_UI_WORKFLOW_STEP_ANCHOR_INVALID:{source.count(step_anchor)}")
              source = source.replace(
                  step_anchor,
                  "      - name: Verify hosted browser capability discovery\n        run: node scripts/check-hosted-ui-contract.mjs\n\n" + step_anchor,
                  1,
              )
          workflow.write_text(source, encoding="utf-8")

          quality = Path(".github/workflows/quality.yml")
          source = quality.read_text(encoding="utf-8")
          anchor = "      - name: Verify topology contract\n"
          if "Verify hosted browser capability contract" not in source:
              if source.count(anchor) != 1:
                  raise SystemExit(f"HOSTED_UI_QUALITY_ANCHOR_INVALID:{source.count(anchor)}")
              source = source.replace(
                  anchor,
                  "      - name: Verify hosted browser capability contract\n        if: ${{ !cancelled() }}\n        run: node scripts/check-hosted-ui-contract.mjs\n\n" + anchor,
                  1,
              )
          quality.write_text(source, encoding="utf-8")
          PY

          node scripts/check-hosted-ui-contract.mjs
          git diff --check

      - name: Frozen install and browser verification
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @evavo/vector-web typecheck
          pnpm --filter @evavo/vector-web build

      - name: Commit integration and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-hosted-ui-capabilities.yml \
            .github/hosted-ui-capabilities.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ui): discover hosted transfer capabilities"
          git pull --rebase origin main
          git push origin HEAD:main
