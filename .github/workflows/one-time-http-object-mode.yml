name: One-time HTTP worker object mode patch

on:
  push:
    branches: [main]
    paths:
      - ".github/http-object-mode.trigger"

permissions:
  contents: write

concurrency:
  group: one-time-http-object-mode
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make HTTP worker capabilities transport-aware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path("workers/http-worker/src/runner.ts")
          source = target.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, code: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{code}:{count}")
              source = source.replace(old, new, 1)

          replace_once(
              '''export type HttpWorkerConfig = Readonly<{
            workerId: string;
            leaseMs?: number;
            heartbeatMs?: number;
            pollMs?: number;
            operations?: readonly VectorWorkerProtocolOperation[];
            completionAttempts?: number;
            completionRetryMs?: number;
          }>;''',
              '''export type HttpWorkerObjectTransport = "shared-file" | "worker-api";

          export type HttpWorkerConfig = Readonly<{
            workerId: string;
            leaseMs?: number;
            heartbeatMs?: number;
            pollMs?: number;
            operations?: readonly VectorWorkerProtocolOperation[];
            completionAttempts?: number;
            completionRetryMs?: number;
            objectTransport?: HttpWorkerObjectTransport;
          }>;''',
              "RUNNER_CONFIG_ANCHOR_INVALID",
          )

          replace_once(
              '''  completionAttempts: number;
            completionRetryMs: number;
          }> {''',
              '''  completionAttempts: number;
            completionRetryMs: number;
            objectTransport: HttpWorkerObjectTransport;
          }> {''',
              "RUNNER_RETURN_TYPE_ANCHOR_INVALID",
          )

          replace_once(
              '''  const requested = config.operations ??
              (VECTOR_WORKER_SUPPORTED_OPERATIONS as readonly VectorWorkerProtocolOperation[]);''',
              '''  const objectTransport = config.objectTransport ?? "shared-file";
            if (objectTransport !== "shared-file" && objectTransport !== "worker-api") {
              throw new HttpWorkerError(
                "HTTP_WORKER_CONFIG_INVALID",
                "objectTransport must be shared-file or worker-api.",
                { details: { objectTransport } },
              );
            }
            const requested = config.operations ??
              (VECTOR_WORKER_SUPPORTED_OPERATIONS as readonly VectorWorkerProtocolOperation[]);''',
              "RUNNER_TRANSPORT_VALIDATION_ANCHOR_INVALID",
          )

          replace_once(
              '''    completionAttempts,
              completionRetryMs,
            });''',
              '''    completionAttempts,
              completionRetryMs,
              objectTransport,
            });''',
              "RUNNER_CONFIG_RETURN_ANCHOR_INVALID",
          )

          replace_once(
              '''      execution: "http-coordinated-shared-object-store",
                operations: this.#config.operations,
                leaseMs: this.#config.leaseMs,
                heartbeatMs: this.#config.heartbeatMs,
                pollMs: this.#config.pollMs,
                completionAttempts: this.#config.completionAttempts,
                completionRetryMs: this.#config.completionRetryMs,
                receiptBackedCompletionReplay: true,
                persistentJobRecords: true,
                sharedImmutableObjectStoreRequired: true,
                objectTransferAvailable: false,
                queueDeliveryAvailable: false,
                managedRemoteExecutionAvailable: false,
                generatedBodiesInControlResponses: false,
                approval: "human-review-required",''',
              '''      execution: this.#config.objectTransport === "worker-api"
                  ? "http-coordinated-object-transfer"
                  : "http-coordinated-shared-object-store",
                objectTransport: this.#config.objectTransport,
                operations: this.#config.operations,
                leaseMs: this.#config.leaseMs,
                heartbeatMs: this.#config.heartbeatMs,
                pollMs: this.#config.pollMs,
                completionAttempts: this.#config.completionAttempts,
                completionRetryMs: this.#config.completionRetryMs,
                receiptBackedCompletionReplay: true,
                persistentJobRecords: true,
                sharedImmutableObjectStoreRequired:
                  this.#config.objectTransport === "shared-file",
                objectTransferAvailable:
                  this.#config.objectTransport === "worker-api",
                queueDeliveryAvailable: false,
                managedRemoteExecutionAvailable: false,
                generatedBodiesInControlResponses: false,
                approval: "human-review-required",''',
              "RUNNER_CAPABILITY_ANCHOR_INVALID",
          )

          target.write_text(source, encoding="utf-8")
          PY
          grep -Fq 'export type HttpWorkerObjectTransport = "shared-file" | "worker-api"' workers/http-worker/src/runner.ts
          grep -Fq 'execution: this.#config.objectTransport === "worker-api"' workers/http-worker/src/runner.ts
          grep -Fq 'sharedImmutableObjectStoreRequired:' workers/http-worker/src/runner.ts
          git diff --check

      - name: Commit patch and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/one-time-http-object-mode.yml \
            .github/http-object-mode.trigger
          git config user.name "EVAVO Repository Automation"
          git config user.email "174633320+EVAVO-STUDIO@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat(http-worker): report active object transport"
          git pull --rebase origin main
          git push origin HEAD:main
